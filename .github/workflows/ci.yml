# ============================================================================
# 回归门禁：任何分支推送 / PR 都必须过这一套，否则不允许发布。
#
# ## 拓扑：**三个并行节点**（不是一条长链）
#
#   ┌─ shell   ── 运行时脚本断言（bash + mksh 各跑一遍）＋ 设备侧语法闸门
#   ├─ node    ── WebUI 纯函数 / 版本比较一致性 / status 契约 / node 语法
#   └─ android ── App 构建 + 单测（带 Gradle 缓存；**产出 APK 制品**给发布线路用）
#
#   三者互相独立、各占一个 runner 并行跑，所以**总时长≈最慢的那个**，而不是各步之和。
#   以前所有检查串在一个 job 里，总时长是累加；再加上发布线路又重编一次 APK，
#   一次发布要 6 分钟以上（实测）。
#
# ## 为什么"任一条失败即失败"必须保留
#   这些检查是**互相补位**的关系，只跑一部分会让问题潜伏到真机才爆 —— 开发中真实发生过：
#     · `assembleDebug` **不编译 test 源集**，只跑它 → 47 个单测静默失效；
#     · 单测引用了已删除的符号（theme 改名），而 APK 照样出得来。
#   拆成多 job 只是**并行**，不是"可选"：任何 job 红，整个门禁红，发布就被挡住
#   （release.yml 里 `gate` 通过 `workflow_call` 复用本文件，结构上保证）。
#
# ## 拆 job 带来的一个必须守住的约定
#   `android` job 会把 APK 作为**制品**上传（名字 `apk-debug`），发布线路直接下载使用，
#   **不再重编**。改制品名/路径时，release.yml 里的 `download-artifact` 必须同步改。
# ============================================================================
name: 回归门禁

on:
  push:
    # ★ main / beta **不在这里触发**：它们交给 release.yml（发布工作流会 workflow_call 本门禁）。
    #   否则同一次推送会跑两遍 CI，而且两个实例落进同一个 concurrency 组，互相取消 ——
    #   实测把「发布」的门禁误杀过（发布直接失败，看起来像代码有问题）。
    # ★ layers 也不在这里触发：那是"层产物 → Release 资产"的传送带分支
    #   （见 layers-release.yml），推的是一堆二进制，跑全量 CI 毫无意义。
    #   注意 GitHub 只跑**被推送分支上存在**的工作流：推荐把 layers 建成分支孤儿
    #   （orphan），只带 layers-release.yml + 产物，本行只是"万一基于 main 建分支"的兜底。
    branches-ignore: [main, beta, layers]
  pull_request:
  workflow_dispatch:
  # 允许发布工作流复用本门禁（release.yml 里 `uses: ./.github/workflows/ci.yml`）
  #
  # embed_bundles：**只有发布路径**才把离线包内嵌进 APK。
  #   为什么默认 false：内嵌要先把三层从频道拉下来再打包（约 100 MB 下载 + 1~2 分钟），
  #   而 PR / 分支推送根本不需要带环境的 APK（徒增几百 MB 制品）。
  #   用显式输入而不是猜 `github.event_name`：可复用工作流里那个值来自调用方，猜不得。
  workflow_call:
    inputs:
      embed_bundles:
        description: '把离线包内嵌进四个组合的 APK（发布时用）'
        type: boolean
        default: false
      # build_apks：**独立门禁**自己把四个组合都编出来（PR / 手动跑时用）。
      #   流水线（pipeline.yml）里 APK 由**矩阵节点**并行产出，本门禁只要断言与单测
      #   → 那边传 false，避免同一批 APK 被编两遍。
      build_apks:
        description: '是否在本门禁里构建四个组合的 APK（流水线里由编译矩阵负责，传 false）'
        type: boolean
        default: true

# 同一分支的旧运行排队（不取消）：本门禁会被 release.yml 复用，
# "取消进行中的运行"分不清"这是新推送的独立跑"还是"发布流程正在等的门禁"。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────── 节点 1：运行时脚本（设备侧语义）
  shell:
    name: 运行时脚本（bash + mksh）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具（proot 供非 root 自测；zstd 供需；mksh 是设备侧真实 shell）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq proot zstd mksh

      # ★ 全部走 tools/ci-shell-gate.sh：失败时用 `::error::` 注释带出"红的是哪几条断言"。
      #   步骤日志要仓库权限才看得到，而 check-run 的 annotations 匿名可读
      #   （维护者在手机上排查 CI 就是靠这个）。
      - name: 脚本断言 — root 运行时
        run: bash tools/ci-shell-gate.sh bash runtime/root/selftest.sh

      # 设备侧真正跑的是 /system/bin/sh（mksh），不是 bash。这一关用 mksh 再跑一遍
      # 同一套断言 —— 语法闸门只管"能不能解析"，这里才验证"跑起来行为一致"。
      - name: 脚本断言 — root 运行时（mksh，模拟设备侧）
        run: bash tools/ci-shell-gate.sh mksh runtime/root/selftest.sh

      - name: 脚本断言 — proot 运行时
        run: bash tools/ci-shell-gate.sh bash runtime/proot/selftest.sh

      - name: 脚本断言 — proot 运行时（mksh，模拟设备侧）
        run: bash tools/ci-shell-gate.sh mksh runtime/proot/selftest.sh

      # proot 的 host 侧脚本（start.sh / linuxctl.sh）必须能被 mksh 解析；但"能解析"
      # 证明不了"改完之后语义还对"（例：`[[ =~ ]]`→case 改错、`/dev/tcp` 在 mksh 下失效）。
      # 这一关从真实脚本里抽取纯函数做回归，bash 与 mksh 各跑一遍（两边结果必须一致）。
      - name: 脚本断言 — proot 纯函数（bash）
        run: bash tools/ci-shell-gate.sh bash runtime/proot/selftest-funcs.sh

      - name: 脚本断言 — proot 纯函数（mksh，模拟设备侧）
        run: bash tools/ci-shell-gate.sh mksh runtime/proot/selftest-funcs.sh

      # 懒人脚本的**冒烟回归**：只跑只读"体检"模式。守的是"能解析 ≠ 能跑"那一类问题 ——
      # 实测踩过：一次编辑把 `bad()` 定义并进了注释，`mksh -n` 照样通过，真机上只表现成
      # 一行 `bad: inaccessible or not found`，而且**阻断计数永远是 0**（该拦的不拦）。
      - name: 脚本断言 — oneshot-setup.sh 冒烟（mksh + bash）
        run: node tools/oneshot-selftest.mjs

      # device-provision.sh 的**行为级冒烟**：设备侧首次部署唯一的入口，1300+ 行，
      # 而"能解析 ≠ 能跑"在这里尤其致命 —— 实测踩过两回：
      #   ① 用 `declare -f` 转储函数生成内层脚本（bash 专有，unshare 里跑的是 mksh）
      #   ② `local tb` 在 mksh 里是"未设置"，配合 `set -u` 直接死在每个阶段的第一步
      # 这一关真的把内层跑起来（临时 LINUX_HOME、故意不给种子），断言它走到"准备 base 阶段"
      # 并以可读错误收场，且**没有任何 shell 级错误**。
      - name: 脚本断言 — device-provision.sh 冒烟（mksh + bash）
        run: node tools/provision-selftest.mjs

      # 真机误报回归：detect-mount.sh 不许拿"当前工作目录"当模块根
      # （用户在 / 下跑 doctor 时 /system 必然存在 → 误报"本模块需要挂载系统路径"）
      - name: 断言 — 挂载实现探测不误报（MODULE_ROOT 契约）
        run: node tools/detect-mount-selftest.mjs

      # 设备上只有 /system/bin/sh（mksh），没有 bash：这一关专门防"本地 bash 跑得通、
      # 真机一行都跑不了"的语法漂移（历史上真的发生过，见 tools/shell-compat-check.mjs 注释）
      - name: 断言 — 设备侧脚本能被 mksh 解析（含 shebang 与欠债名单）
        run: node tools/shell-compat-check.mjs --verbose

      # 模块安装脚本的**行为级**回归：真机上那段文案曾被 ASCII 双引号截断
      # （`ui_print "…"…"…"` → 后半句被当参数吞掉，mksh -n/bash -n 都看不见）
      - name: 断言 — 模块安装脚本文案与沙箱运行（mksh）
        run: node tools/customize-selftest.mjs

      # 模块两变体（full/bare）的**行为级**回归（docs/module-variants.md）：
      #   打包规则（full 必须有载荷、bare 必须没有、默认名只给 full）、安装时的落地链路、
      #   以及"一条指令从验签过的频道装 DSH + 可回滚到内置版本"整条走一遍。
      #   守的是最危险的失败模式：打了不带 DSH 的包却顶着默认名发出去（用户装完起不来）。
      - name: 断言 — 模块两变体（full/bare）打包 + 内置 DSH 落地 + 一条指令装层
        run: node tools/module-variant-selftest.mjs

      - name: 断言 — shell 语法（全套 .sh）
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" 2>/dev/null || { echo "语法错误: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './app/*' -not -path './build/*' -not -path './dist/*')
          exit $fail

  # ───────────────────────────────── 节点 2：JS 纯函数与冻结契约
  node:
    name: JS 契约与纯函数
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 断言 — 模块 WebUI 纯函数
        run: node module/webroot/selftest.mjs

      - name: 断言 — 三方版本比较一致性（WebUI / update.sh / 发布工具）
        run: node tools/cmp-consistency.mjs

      - name: 断言 — 流水线变更集判定（"该不该编译/发布" + 参数校验）
        run: node tools/ci-changeset-selftest.mjs

      - name: 断言 — status JSON 契约（冻结 schema §3.1）
        run: |
          node tools/contract-check.mjs --cmd 'bash runtime/root/linuxctl.sh status'
          node tools/contract-check.mjs --cmd 'bash runtime/proot/linuxctl.sh status'

      - name: 断言 — node 语法（tools/ 与 webroot/）
        run: |
          fail=0
          for f in $(find tools module/webroot -name '*.mjs'); do
            node --check "$f" 2>/dev/null || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

  # ───────────────────────────────── 节点 3：App（慢，带缓存，产出制品）
  android:
    name: App 构建 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          # ★ 不要用它的默认值（`tools platform-tools`）：`tools` 包**已经从 Google 的
          #   SDK 仓库移除**，sdkmanager 会报 "Failed to find package 'tools'" 并以 1 退出
          #   —— 实测就是这样把 CI 卡死的（动作本身没坏，是默认包列表过时了）。
          #   只装确实需要的：platform-tools + 我们的 compileSdk(35) 平台。
          #   build-tools 交给 AGP 按需下载（licenses 已由本动作接受）。
          packages: 'platform-tools platforms;android-35'
          # 接受许可证但**不要把它们打印出来**：默认会把 6 段许可证全文刷进日志
          # （实测一次几千行），把真正有用的构建输出淹掉。
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Gradle 缓存：首次跑要下 Gradle 发行包 + 全部依赖（实测 2m40s 里大半花在这），
      # 缓存后通常 1 分钟内。key 跟着构建脚本/版本目录变，不会用错缓存。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle*', 'app/gradle/libs.versions.toml', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 关掉 Gradle 守护进程（CI 上没必要常驻）
        run: echo "org.gradle.daemon=false" >> app/gradle.properties

      # 签名：**默认用仓库里那把固定的调试密钥**（app/app/debug.keystore），所以本步可以什么都不做
      # —— 关键在于"永远不要落到 runner 自己新生成的 ~/.android/debug.keystore"，
      # 否则每次发布签名都不同：用户装新版报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，
      # 且 KernelSU 已授予的 root 授权（按包名+签名记录）全部作废。
      # 配了 Secret 就用私有发布密钥（更安全）；⚠️ 换密钥那次用户必须卸载重装一次。
      # 终端用的原生 PTY（src/main/cpp/pty.c）需要 NDK 来编：
      # 我们不走 AGP 的 externalNativeBuild（官方 NDK 只有 x86_64 宿主工具链，
      # 而 aarch64 环境上那个 clang 跑不了），由 tools/ndk-build-pty.sh 自己驱动。
      - name: 安装 NDK（编译终端用的原生 PTY；带重试）
        run: |
          set -uo pipefail
          NDK_VER=26.1.10909125
          DEST="$ANDROID_SDK_ROOT/ndk/$NDK_VER"
          # 镜像里已经带了就直接用（多数 runner 镜像都预装了若干 NDK）
          if [ -d "$DEST" ]; then
            echo "NDK 已在镜像里：$DEST（跳过安装）"
            exit 0
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # ★ 为什么要重试（2026-09-17 CI 实测）：sdkmanager 报
          #   `Error reading Zip content from a SeekableByteChannel` = 下载/解包拿到半截坏包。
          #   这是 CDN 侧偶发，与提交内容无关，但会把整条门禁挡在编译之前。
          #   重试前必须清掉半截产物：否则 sdkmanager 复用坏缓存、每次都报同一个错。
          for i in 1 2 3; do
            rm -rf "$DEST" "$ANDROID_SDK_ROOT/.downloadIntermediates" 2>/dev/null || true
            if sdkmanager --install "ndk;$NDK_VER" >/dev/null 2>&1 && [ -d "$DEST" ]; then
              echo "NDK 就绪：$DEST（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::NDK 第 $i 次安装失败（多为 CDN 返回坏 zip），10s 后重试"
            sleep 10
          done
          echo "::error::NDK $NDK_VER 三次都没装上：sdkmanager 下载/解包失败（不是本次代码的问题）"
          exit 1

      - name: 准备签名密钥（有 Secret 用发布密钥，否则用仓库内固定调试密钥）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SUNSETLINUX_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "SUNSETLINUX_KEYSTORE_PASSWORD=$KS_PASS"
              echo "SUNSETLINUX_KEY_ALIAS=$KS_ALIAS"
              echo "SUNSETLINUX_KEY_PASSWORD=$KS_KEYPASS"
            } >> "$GITHUB_ENV"
            echo "签名：使用 Secret 提供的**发布密钥**"
          else
            echo "签名：未配置 ANDROID_KEYSTORE_BASE64 → 使用仓库内固定的调试密钥" >> "$GITHUB_STEP_SUMMARY"
            echo "签名：未配置 ANDROID_KEYSTORE_BASE64 → 使用仓库内固定的调试密钥（app/app/debug.keystore，签名稳定、可覆盖安装）"
          fi

      # ── 内嵌离线包（仅发布路径）────────────────────────────────────────────
      # 四个组合的 APK 要真的自带环境，就得在**构建前**把离线包放进 dist/bundles/。
      # 离线包从**签名频道清单**拉层再打包（与 offline-bundle.yml 同一套工具），
      # 所以 CI 打出来的 APK 与用户从频道装到的层**必然同源**。
      # 任何一步失败都只是"本次不内嵌"（警告 + 继续），绝不让发布因为网络问题失败。
      - name: 取离线包（有就内嵌进 APK；仅发布路径）
        if: ${{ inputs.embed_bundles }}
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SITE="https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p dist/bundles
          if ! curl -fsSL --retry 3 -o dist/channel.json "$SITE/channel/channel.json"; then
            echo "::warning::拿不到频道清单 → 本次 APK 不内嵌离线包（不影响功能，只是装完要联网装层）"
            exit 0
          fi
          node - <<'NODE' > dist/layers.tsv || { echo "::warning::清单解析失败，跳过内嵌"; exit 0; }
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('dist/channel.json', 'utf8'));
          for (const l of m.layers ?? []) {
            const url = l.url || l.url_gz;
            const sha = l.url ? l.sha256 : l.sha256_gz;
            if (!url || !sha) continue;
            console.log([l.id, l.version, url, sha, url.endsWith('.gz') ? 'gz' : 'zst', l.sha256_raw ?? '', l.size_raw ?? ''].join('\t'));
          }
          NODE
          : > dist/SHA256SUMS.layers.txt
          while IFS=$'\t' read -r id ver url sha ext raw rawsize; do
            f="dist/$id-$ver.erofs.$ext"
            curl -fsSL --retry 3 -o "$f" "$url" || { echo "::warning::下载 $id 失败，跳过内嵌"; exit 0; }
            got="$(sha256sum "$f" | awk '{print $1}')"
            [ "$got" = "$sha" ] || { echo "::warning::$id 层 sha256 不符，跳过内嵌"; exit 0; }
            if [ -n "$raw" ] && [ -n "$rawsize" ]; then
              printf '%s-%s.erofs  %s  %s\n' "$id" "$ver" "$rawsize" "$raw" >> dist/SHA256SUMS.layers.txt
            fi
          done < dist/layers.tsv
          # ── proot 运行时（minimal / ubuntu-proot / 完整离线版都要）────────────
          # ★ 必须带 token：无认证的 releases API 是 **60 次/小时的共享 IP 限额**，
          #   runner 上经常撞到 403。而 403 在这里只会让 PURL 变成空字符串 ——
          #   接着 mk-bundle --available 就把含 proot 的三个变体**静默跳过**：
          #   0.2.6 发布时真的发生了（minimal / ubuntu-proot / ubuntu-proot-dsh 三个 APK
          #   变成 12 MB，里面没有 offline-bundle.bin，用户装完照样得联网）。
          PURL="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
                  -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const rs=JSON.parse(s);for(const r of rs){if(!String(r.tag_name||"").startsWith("layers-"))continue;const a=(r.assets||[]).find(x=>/^proot-bundle-.*\.tar\.gz$/.test(x.name));if(a){console.log(a.browser_download_url);break}}})' || true)"
          if [ -z "${PURL:-}" ]; then
            echo "::error::拿不到 proot 运行时（layers-* Release 里没有 proot-bundle-*.tar.gz，或 API 返回 401/403）—— 内嵌不完整就不要发"
            exit 1
          fi
          curl -fsSL --retry 3 -o "dist/$(basename "$PURL")" "$PURL"
          echo "已取 proot：$(basename "$PURL")"

          node tools/offline-bundle/mk-bundle.mjs --available --dir dist --out dist/bundles
          ls -l dist/bundles/*.bin

          # ★ 该有几个就一个不能少 —— 数量**由 variants.json 决定**（单一事实源）：
          #   embed 为空的变体（root-minimal：root 模式的层走频道）本来就没有 .bin，
          #   所以不能写死 4。缺一个就红：宁可发布失败（重跑一次就好），
          #   也不要发出一个"装完还得联网"的完整版。
          WANT="$(python3 -c 'import json;v=json.load(open("tools/offline-bundle/variants.json",encoding="utf-8"))["variants"];print(sum(1 for s in v.values() if s.get("embed")))')"
          GOT="$(ls dist/bundles/*.bin 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$GOT" -ne "$WANT" ]; then
            echo "::error::离线包只打出 $GOT/$WANT 个（缺的变体对应的 APK 会没有内嵌环境）"
            echo "- 已有的：$(ls dist/bundles 2>/dev/null | tr '\n' ' ')"
            echo "- 频道清单里的层：$(cut -f1,2 dist/layers.tsv 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      # ── 模块 zip（App 首启引导的「一键刷入内置模块」靠它内嵌进 APK）──────────
      # ★ 必须在 Gradle 构建**之前**产出：`SyncBundledModule` 从 `dist/` 取包，
      #   写进 `assets/module/sunsetlinux-module.zip` + `module.json`。
      #   2026-09-16 实测踩过：release.yml 里模块 zip 是**构建 APK 之后**才打的，
      #   于是 CI 出的 0.2.12 官方 APK 里没有 `assets/module/` —— 用户点
      #   「一键刷入内置模块」只会看到"这个 APK 没有内嵌模块包"（本机自测有、
      #   官方包没有，属于最坏的一类不一致）。
      - name: 打包模块 zip（供 APK 内嵌）
        if: ${{ inputs.build_apks != false }}
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y -qq zip
          # ★ APK 内嵌的是 **bare 变体**（docs/module-variants.md §2.6）：
          #   APK 的 base/full 档已经把 dsh 层放进离线包了，模块再内嵌一份 = 同样的
          #   48 MB 塞两遍。默认名（不带后缀）只给 full，所以这里必须显式要 bare。
          bash module/mkmodule.sh --variant bare
          ls -l dist/sunsetlinux-module-*.zip

      - name: Android 构建 + 单测（★ 两条一起跑）
        id: android
        working-directory: app
        env:
          # 单测里有**中文测试方法名**（`fun \`磁盘缓存…\``）—— JVM 用 sun.jnu.encoding 决定
          # 写 .class 文件时的编码，而它由**启动时的 locale** 决定（-D 覆盖不了）。
          # runner 默认一般是 C.UTF-8，这里显式写死，免得换个镜像就出现
          # `InvalidPathException: Malformed input or input contains unmappable characters`。
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        # ★ 四个内置组合（flavor）是同一份代码，单测只需跑一个变体 ——
        #   跑 `testDebugUnitTest` 会变成歧义任务（AGP 直接报 ambiguous），
        #   跑全部四个变体则白等 4 倍时间。assembleDebug 仍然四个全建。
        run: |
          set -euo pipefail
          # ★ 单测任务名**从 variants.json 推**（别再写死某个 flavor：0.3.0 拆版后
          #   `ubuntu*` 这些 flavor 已经不存在，写死会直接"任务不存在"）。
          #   第一个变体的 Gradle 任务名 = 按 '-' 分段首字母大写 + DebugUnitTest。
          # ⚠️ 路径必须用 $GITHUB_WORKSPACE：本步骤的 working-directory 是 `app/`，
          #    写相对路径 `tools/offline-bundle/variants.json` 会 FileNotFoundError
          #    （0.3.0 第一次跑就是这样红的，白等一轮 CI）。
          VJ="$GITHUB_WORKSPACE/tools/offline-bundle/variants.json"
          FIRST="$(python3 -c 'import json,sys;print(list(json.load(open(sys.argv[1],encoding="utf-8"))["variants"])[0])' "$VJ")"
          # ⚠️ 任务名是 `test<变体>DebugUnitTest`（`test` 前缀别漏 —— 少一个前缀就是
          #    "Task ... not found"，而报错信息只会说任务不存在，看着像 flavor 配错了）
          TASK="test$(python3 -c "print(''.join(p[:1].upper()+p[1:] for p in '$FIRST'.split('-'))+'DebugUnitTest')")"
          echo "· 单测任务：:app:$TASK（变体 $FIRST，矩阵来自 $VJ）"
          if [ "${{ inputs.build_apks }}" = "false" ]; then
            echo "· 流水线模式：APK 由编译矩阵并行产出，这里只跑单测"
            ./gradlew --no-daemon ":app:$TASK"
          else
            echo "· 独立门禁模式：全部组合一起编 + 单测"
            ./gradlew --no-daemon :app:assembleDebug ":app:$TASK"
          fi

      - name: 单测结果摘要
        # 只在构建**真的跑过**时才当"必须有用例"来判定：前面某步先失败时构建会被跳过，
        # 此时 tests=0 是真的（没跑），再报一次错只是噪音（实测就被这条误导过）。
        if: always() && steps.android.conclusion == 'success'
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/app/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0))
              e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"单测汇总：tests={t} failures={f} errors={e} skipped={s}")
          raise SystemExit(1 if (f or e or t == 0) else 0)
          PY

      # ★ 制品：发布线路（release.yml）直接下载这个，**不再重编一遍 APK**。
      #   名字/路径改动必须同步 release.yml 的 download-artifact。
      # proroot 是**专有许可**：只能随完整 APK 再分发。这一关保证
      # ① 仓库/工作流里没有裸 .so（公开仓库的独立分发不允许）
      # ② APK 里 5 个 .so 齐全且 sha256 与上游一致（没被 strip）
      # ③ APK 带许可原文、关于页有 attribution
      # 终端不能用"静默降级"糊过去：APK 里必须真的带上 PTY .so
      - name: 断言 — APK 内含原生 PTY（终端底座）
        if: ${{ inputs.build_apks != false }}
        run: |
          set -euo pipefail
          tools/ndk-build-pty.sh --check
          fail=0
          for apk in $(find app/app/build/outputs/apk -name '*.apk'); do
            # ★ 不用 `unzip -l "$apk" | grep -q`：set -o pipefail 下 grep 命中即退会让 unzip
            #   吃 SIGPIPE(141) → 正常 APK 被判成缺这个 .so（0.3.6 首跑已在别处踩过同款假红）。
            apklist="$(unzip -l "$apk" 2>/dev/null || true)"
            case "$apklist" in
              *'lib/arm64-v8a/libsunsetlinux_pty.so'*)
                echo "✓ $(basename "$apk") 带 libsunsetlinux_pty.so" ;;
              *)
                echo "::error::$apk 缺少 libsunsetlinux_pty.so —— 终端会退回行缓冲（Ctrl-C/vim 不可用）"
                fail=1 ;;
            esac
          done
          exit $fail

      # 内嵌不完整就不要发：App 的首启引导第 2 步是「一键刷入内置模块」，
      # 它读的正是 assets/module/。缺了它，用户看到的按钮点了只会提示"未内嵌"。
      # 内嵌内容按 edition 断言（0.3.0 起两个 App：root 带模块包、proot 带宿主脚本）
      - name: 断言 — APK 的内嵌内容与本版匹配
        if: ${{ inputs.build_apks != false }}
        run: |
          set -euo pipefail
          fail=0
          # 本次**真的产出了**离线包吗？产出了才把「声明要内嵌、APK 里却没有」当红；
          # 没产出（本机手编/门禁不带包）时脚本自己降级成提示。
          REQ=""
          if compgen -G 'dist/bundles/*.bin' >/dev/null 2>&1; then REQ=--require; fi
          # ★ 不要写 `unzip -l "$apk" | grep -q 模式`：本步骤是 set -o pipefail，
          #   `grep -q` 一命中就退出，unzip 可能吃 SIGPIPE(141) → 把一个**正常 APK**
          #   判成"没内嵌"。0.3.6 首跑已经在 mkmodule 里踩过同款假红。
          #   改成把清单读进变量、用 case 做字符串匹配（无管道、无子进程）。
          list_has() { case "$1" in *"$2"*) return 0 ;; *) return 1 ;; esac; }
          for apk in $(find app/app/build/outputs/apk -name '*.apk'); do
            name="$(basename "$apk")"
            apklist="$(unzip -l "$apk" 2>/dev/null || true)"
            case "$name" in
              *-root-*)
                if list_has "$apklist" 'assets/module/sunsetlinux-module.zip'; then
                  echo "✓ $name 带 assets/module/sunsetlinux-module.zip"
                  # ★ 必须是 **bare 变体**（docs/module-variants.md §2.6）：full 自带 DSH 层
                  #   （约 48 MB），而 base/full 档 APK 的离线包里已经有 DSH 了 ——
                  #   内嵌 full 等于同一份内容塞两遍，且会让"换组合=覆盖安装"莫名变大。
                  # ⚠️ 去掉空白再匹配：Gradle 写的是 `"variant": "bare"`（冒号后带空格），
                  #    按 `"variant":"bare"` 逐字匹配会把正确的包判成错（0.3.6 首跑就是这么假红的）。
                  mj="$(unzip -p "$apk" assets/module/module.json 2>/dev/null | tr -d ' \n\t' || true)"
                  case "$mj" in
                    *'"variant":"bare"'*) echo "✓ $name：内嵌模块是 bare 变体" ;;
                    *) echo "::error title=APK 内嵌的模块不是 bare 变体::$name 的 module.json=${mj:-（读不到）} —— full 自带 DSH 层，不该进 APK"; fail=1 ;;
                  esac
                else
                  echo "::error title=Root 版没内嵌模块包::$apk 缺少 assets/module/sunsetlinux-module.zip ——「一键刷入内置模块」会退化成未内嵌（构建前跑 module/mkmodule.sh --variant bare 即可）"
                  fail=1
                fi ;;
              *-proot-*)
                if list_has "$apklist" 'assets/proot-runtime/linuxctl.sh'; then
                  echo "✓ $name 带 assets/proot-runtime/linuxctl.sh"
                else
                  echo "::error title=免 root 版缺宿主脚本::$apk 缺少 assets/proot-runtime/linuxctl.sh"
                  fail=1
                fi ;;
              *)
                echo "::warning::认不出 edition 的 APK：$name（命名规则变了？）" ;;
            esac
            # ★ 再补一道「该内嵌的离线包**真的进了 APK**」。0.2.6 漏过一次：那一批 APK
            #   是 12 MB、没有 offline-bundle.bin（用户装完照样联网），而 CI 全绿 ——
            #   bundles 节点只数了 dist/bundles/*.bin 够不够，编译节点只看 edition 专属
            #   资源，**没人打开 APK 看**。EmbedOfflineBundle 找不到包是"记一行日志就跳过"
            #   （本机开发方便），所以只有这里能兜住"制品名对不上 ⇒ 一个都没内嵌"。
            variant="$(printf '%s' "$name" | sed -E 's/^SunsetLinux-[^-]+-(.+)-debug\.apk$/\1/')"
            if [ "$variant" = "$name" ]; then
              echo "::warning::从文件名推不出组合，跳过内嵌断言：$name"
            elif [ -n "$REQ" ]; then
              tools/ci-assert-embed.sh "$apk" "$variant" --require || fail=1
            else
              tools/ci-assert-embed.sh "$apk" "$variant" || fail=1
            fi
            # 身份（包名 + 桌面标签）：见 tools/ci-assert-identity.sh 头部 —— 两条真事故
            tools/ci-assert-identity.sh "$apk" "$variant" || fail=1
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: 断言 — proroot 许可合规（不得独立分发；APK 内必须完整）
        if: ${{ always() && inputs.build_apks != false && steps.android.conclusion == 'success' }}
        run: node tools/proroot/compliance-test.mjs

      - name: 上传 APK 制品（供发布线路复用）
        if: ${{ inputs.build_apks != false && steps.android.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          # 四个组合各一份（minimal / ubuntu / ubuntu-proot / ubuntu-proot-dsh），
          # 文件名由 build.gradle.kts 的 androidComponents.onVariants 生成。
          path: app/app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
