# ============================================================================
# 发布（**可复用工作流**：收集产物 → index.json → 下载页 → gh-pages → Release）
#
# 谁调它：
#   · pipeline.yml   —— 每次推 main/beta 的**唯一**发布路径（prep → 矩阵编译 → 门禁 → 本文件）
#   · release.yml    —— 手动兜底（workflow_dispatch），出问题时可以单独重发一次
#
# 它做五件事（都在一个 job 里，写 gh-pages 的操作必须串行 —— 见 concurrency）：
#   ① 收集本轮构建产物（APK / 模块 zip / 内嵌离线包 .bin）到 dist/_publish/
#   ② 生成 index.json（App 的「更新」页与下载页都读它）
#   ③ 取 channel 分支上**已签名**的频道清单，用公钥**独立验签**（不过就不带 /channel/）
#   ④ **一次**推 gh-pages：/<stable|beta>/ + /channel/ + 站点根页（仅 stable）
#   ⑤ 建/更新 GitHub Release（仅 stable；beta 只更新 gh-pages 目录）
#
# 输入：
#   channel: auto | stable | beta   —— auto 时按调用方分支判断（main→stable、beta→beta）
#
# ── gh-pages 推送次数：**为什么必须一次推**（2026-09-17 改）────────────────────
#   GitHub Pages 是「分支推送驱动」的：**每推一次** gh-pages 都会起一次
#   `pages build and deployment`。同一轮发布推两次，就会出现**两条** Pages 构建，
#   后一条把前一条取代 —— 历史记录里成对出现：`#114 取消/#115 成功`、
#   `#118 取消/#119 成功`、`#120 取消/#121 成功`、`#126 失败/#127 成功`。
#   前一条是纯噪声，而且会把"最近一次构建失败"的记录留在 Pages 页面上。
#
#   改之前，一轮 stable 发布实际推了**三次** gh-pages（= 三条 Pages 构建）：
#     ① `/stable/`       —— 本文件"发布到 gh-pages 的对应目录"
#     ② 站点根 `/index.html` —— 本文件"发布站点根页（仅 stable）"
#     ③ `/channel/`      —— pipeline.yml 的 ⑥ channel job 同步 channel 分支的签名清单
#   现在合成**一次提交**：下面"合成站点根那棵树"那步把这三种内容拼进 dist/_site/，
#   再由**一个** peaceiris 步骤整棵推上去 —— **一轮发布 = 一次推送 = 一条 Pages 构建**。
#   ⑥ 因此改成只验签、不推送（校验价值留在那条独立门禁里）。
#
#   仍然**各自独立推 gh-pages** 的入口（都不是日常流水线路径，保持原样）：
#     · channel.yml        —— channel 分支的 channel.json 变化时：签名 + 验签 + 发 /channel/
#     · layers.yml         —— 手动跑（自建 arm64 runner）：可选发 /channel/
#     · layers-release.yml —— 只往 Release 上传层文件，**完全不碰 gh-pages**
#   往后再加"发布时要同步到站点"的东西，请拼进 dist/_site/，**不要**再加第二次推送。
#
# ⚠️ 本文件是从 release.yml 的 publish job **原样搬过来的**（注释与踩坑记录都保留）。
#    搬动的原因见 docs/release-ci.md：以前"门禁在 ci.yml、发布在 release.yml、
#    离线包在 offline-bundle.yml"三条线并行靠**时间**对齐（离线包那步要等 6 分钟
#    看 Release 出现），现在改成一条流水线靠 **needs** 对齐。
# ============================================================================
name: 发布（可复用）

on:
  workflow_call:
    inputs:
      channel:
        description: '发布通道：auto（按分支）/ stable / beta'
        type: string
        default: auto
  # 手动兜底：只重发一次（不重新编译），用于"构建产物已经在了、只是发布那步失败"
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道'
        type: choice
        options: [auto, stable, beta]
        default: auto

# ⚠️ 这里**刻意不放工作流级的 concurrency**：本文件是**可复用工作流**，
#    工作流级 concurrency 在"被调用"时会被 GitHub 拒掉（表现是调用方那个 job
#    0 秒失败、连 runner 都没起，日志里什么都没有）——串行改由 job 级承担
#    （下面 publish job 的 concurrency: gh-pages，与 channel.yml 共用同一个组）。
jobs:
  publish:
    # 这里**没有** needs：可复用工作流自己不带前置节点（以前 release.yml 里
    # `needs: gate` 指的是它自己的门禁 job，搬到独立文件后就不存在了 —— 留着会让
    # GitHub 直接拒绝加载本文件，报错还只显示"workflow file invalid"）。
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 需要推 gh-pages 分支
    # ★ 每个 run: 步骤都留一份日志到 $RUNNER_TEMP/ci-steps.log：
    #   步骤日志要仓库权限才看得到（手机上排查时看不到），而工作流末尾那个
    #   `if: failure()` 的步骤会把尾部贴成 `::error::` 注释 —— 注释匿名可读。
    defaults:
      run:
        shell: bash ${{ github.workspace }}/tools/ci-step-tee.sh {0}
    # ★ 与 channel.yml 共用同一个组：都会写 gh-pages。放在 **job 级**，
    #   这样两个分支的门禁可以并行验证，只有"真正写 gh-pages"这一步需要排队。
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: 确定发布通道（beta / stable）
        id: ch
        env:
          # workflow_call 时 inputs.channel 来自调用方；workflow_dispatch 时来自人工选择。
          # auto = 按**调用方分支**判断（main→stable，beta→beta），与以前一致。
          WANT: ${{ inputs.channel || 'auto' }}
        run: |
          want="${WANT:-auto}"
          if [ "$want" = "auto" ]; then
            case "${{ github.ref_name }}" in
              beta) want=beta ;;
              *)    want=stable ;;
            esac
          fi
          case "$want" in
            beta)  echo "dir=beta"   >> "$GITHUB_OUTPUT"; echo "label=预发布（beta）"  >> "$GITHUB_OUTPUT" ;;
            stable) echo "dir=stable" >> "$GITHUB_OUTPUT"; echo "label=正式（stable）" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::未知通道：$want（只支持 auto/stable/beta）"; exit 2 ;;
          esac

      # ★ 不再重编 APK：门禁那个 job 已经编过并把产物上传成制品 `apk-debug`。
      #   这里只下载，省掉一次完整 Gradle 构建（实测约 2m40s）。
      - name: 取回门禁构建好的 APK（制品）
        uses: actions/download-artifact@v4
        with:
          # ★ 用 **pattern** 而不是固定名字：APK 可能来自两个不同的生产者 ——
          #   · pipeline.yml 的编译矩阵：每个组合一个制品（apk-minimal / apk-ubuntu / …）
          #   · ci.yml 的独立门禁  ：一个制品装四个组合（apk-debug）
          #   pattern 两种都覆盖，且 merge-multiple 会把它们解到同一个 apk-artifact/ 下
          #   （下面那段"制品不是平铺的"注释说的层级问题依然成立，所以还是递归找）。
          pattern: apk-*
          merge-multiple: true
          path: apk-artifact

      # 内嵌离线包（pipeline 的 ② 节点产出）。**允许没有**：手动重发时可能只重跑发布，
      # 那时制品不在 → continue-on-error，收集那步会按"可选产物"处理。
      - name: 取回内嵌离线包（有就随 Release 一起发）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: offline-bundles
          path: dist/bundles

      # 默认模块（full 变体：自带 DSH，② 节点用频道里的 dsh 层打的）。
      # **允许没有**：频道里暂时没有 dsh 层时 ② 会明确跳过（那就只发 bare）。
      - name: 取回默认模块（full 变体，有就作为默认发布）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: module-zip-full
          path: dist/module-full

      - name: 把制品 APK 收进 dist/（六个内置组合各一份）
        run: |
          set -euo pipefail
          # 门禁那边上传的是**六个组合**的 debug APK（2 个 App × 3 档：
          # root/proot × minimal/base/full），文件名由 build.gradle.kts 的
          # androidComponents.onVariants 生成：
          #   SunsetLinux-<版本>-<组合>-debug.apk
          # ★ 必须自己建 dist/：这一步跑在 mkmodule 之前，而 dist/ 是 mkmodule 建的。
          #   漏了这行会 `cp: cannot create regular file 'dist/...'`（实测踩过）。
          mkdir -p dist
          # ⚠️ 制品解出来**不是平铺的**：upload-artifact 会保留"相对公共祖先"的目录结构，
          #    我们上传的是 app/app/build/outputs/apk/*/debug/*.apk → 解出来是
          #    apk-artifact/<组合>/debug/*.apk。实测就是这么踩的：通配 apk-artifact/*.apk
          #    一个都没匹配到，直接报"没收到任何 APK 制品"（而制品其实有 46 MB）。
          #    所以这里递归找，别写死层级。
          n=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp -v "$f" dist/
            n=$((n + 1))
          done < <(find apk-artifact -type f -name '*.apk' | sort)
          [ "$n" -ge 1 ] || {
            echo "::error::没收到任何 APK 制品（apk-artifact/ 下没有 .apk；同步 ci.yml 的 upload-artifact 路径？）"
            exit 1
          }
          # 组合清单从 variants.json 读（单一事实源；0.3.0 起是 root/proot × minimal/base/full 六个）
          # 缺一个就明确报出来（不许静默少发一个包）
          for v in $(python3 -c 'import json;print(" ".join(json.load(open("tools/offline-bundle/variants.json",encoding="utf-8"))["variants"]))'); do
            ls dist/SunsetLinux-*-"$v"-debug.apk >/dev/null 2>&1 \
              || echo "::warning::缺少组合 $v 的 APK（本次不发这个组合）"
          done
          ( cd dist && sha256sum SunsetLinux-*.apk > SHA256SUMS.apk.txt && cat SHA256SUMS.apk.txt )

      - name: 打包 KernelSU 模块（两个变体：默认 full + bare）
        run: |
          # 版本取 module.prop 里的 version=，构建号用 run_number 便于区分
          V="$(sed -n 's/^version=//p' module/module.prop | head -n1)"
          [ -n "$V" ] || { echo "module.prop 里没有 version="; exit 1; }
          # 产物名统一为 <product>-<组件>-<版本>：去掉 module.prop 里那个 `v` 前缀
          # （module.prop 自己保留 v1.0.0 没关系，WebUI 会把 v1.0.0 与 1.0.0 视为一致）
          VER="${V#v}"
          echo "MODULE_VERSION=$VER" >> "$GITHUB_ENV"

          # ① bare：APK 内嵌用的那种（不带 DSH），也是"想自己控制 DSH 版本"的人的备用包。
          #    ★ 必须显式 --variant bare：默认变体是 full，而这里拿不到 dsh 层。
          bash module/mkmodule.sh --version "$VER" --variant bare

          # ② 默认（full）：来自 ② bundles 节点的制品（它拿的是**签名频道里**的 dsh 层）。
          #    没有制品 = 本次频道里没有 dsh 层 → **不产出默认名**（绝不拿 bare 冒充默认版本）。
          if compgen -G 'dist/module-full/sunsetlinux-module-*.zip' >/dev/null 2>&1; then
            cp -v dist/module-full/sunsetlinux-module-*.zip dist/
            cp -v dist/module-full/sunsetlinux-module-*.zip.sha256 dist/ 2>/dev/null || true
          else
            echo "::warning::本次没有默认模块（full，自带 DSH）—— 只发 bare；下载页与 Release 说明会写明"
            echo "MODULE_DEFAULT_MISSING=1" >> "$GITHUB_ENV"
          fi
          ls -l dist/sunsetlinux-module-*.zip

      - name: 收集产物 + 生成 index.json
        run: |
          set -euo pipefail
          OUT="dist/_publish"
          rm -rf "$OUT"; mkdir -p "$OUT"
          # 先明确检查要发布的东西在不在：直接 cp 通配符失败时报的是
          # `cp: cannot stat 'dist/*.apk'`，很难看出缺的是哪一环（实测踩过两次：
          # 一次是 APK 没收进 dist、一次是 dist 目录都还没建）。
          for pat in 'dist/*.apk' 'dist/*module*.zip'; do
            # shellcheck disable=SC2086
            ls $pat >/dev/null 2>&1 || { echo "::error::没有匹配 $pat 的产物，发布中止"; exit 1; }
          done
          cp -v dist/*.apk "$OUT"/
          cp -v dist/*module*.zip "$OUT"/
          cp -v dist/*module*.zip.sha256 "$OUT"/ 2>/dev/null || true

          # 内嵌离线包（.bin / .json）：pipeline 的 bundles 节点产出后会落到 dist/bundles/。
          # ★ 必须挂进同一个 Release：index.json 里每个变体的 `bundle` 名字对应
          #   `releases/download/<tag>/SunsetLinux-<ver>-<id>.bin`，缺了它下载页上的
          #   "内嵌包"链接会 404（以前由 offline-bundle.yml 自己等 Release 出现再挂，
          #   现在改成同一条流水线里由 needs 保证顺序）。
          for pat in 'dist/bundles/*.bin' 'dist/bundles/*.json'; do
            # shellcheck disable=SC2086
            ls $pat >/dev/null 2>&1 && cp -v $pat "$OUT"/ || true
          done

          # 可选产物（有就发，没有不算发布失败）：
          #   · proot 运行时 bundle（~1 MiB）—— **非 root 模式没有它就根本起不来**，
          #     而 App 至今没随包带它、也没有下载路径（doctor 里那句"App 应随包携带"一直是空的）。
          #   · 离线种子（~59 MiB）—— 只有构建过才有；proot 模式的 provision 需要它。
          #
          # ⚠️ **CI 目前不会产出这两样**（dist/ 是 gitignore 的，runner 上只有源码）——
          #    所以这一步只在"本地构建过、且把 dist/ 一起带上来"时才有东西可发。
          #    没有就**明确说出来**，别让它悄悄什么都不做（本项目的规矩：不制造文档/实现漂移）。
          #    要让它真正产出，下一步：CI 里从 Debian 的 proot arm64 deb 重建 bundle
          #    （命令已验证可复现：curl deb → dpkg-deb -x → mkproot-bundle.sh --arch arm64；
          #     跨架构 runner 上需要跳过"运行 --version"那步自检）。
          found_bundle=0
          found_seed=0
          for pat in 'dist/proot-bundle-*.tar.gz' 'dist/proot-bundle-*.tar.gz.sha256'; do
            # shellcheck disable=SC2086
            if ls $pat >/dev/null 2>&1; then cp -v $pat "$OUT"/; found_bundle=1; fi
          done
          for pat in 'dist/sunsetlinux-seed-*.tar.zst' 'dist/sunsetlinux-seed-*.tar.zst.sha256'; do
            # shellcheck disable=SC2086
            if ls $pat >/dev/null 2>&1; then cp -v $pat "$OUT"/; found_seed=1; fi
          done
          {
            echo "### 可选产物"
            echo ""
            if [ "$found_bundle" -eq 1 ]; then
              echo "- ✅ proot 运行时 bundle：已随本次发布"
            else
              echo "- ⚠️ **本次没有 proot 运行时 bundle**（CI 还不产出它）：非 root 模式的用户拿不到运行时。"
              echo "  重建命令见 \`docs/STATUS.md\` §3.11 / \`runtime/proot/README.md\` §2.2"
            fi
            if [ "$found_seed" -eq 1 ]; then
              echo "- ✅ 离线种子：已随本次发布"
            else
              echo "- ⚠️ 本次没有离线种子（它只在本地构建过 \`tools/seed\` 时存在）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY'
          import json, hashlib, os, glob, datetime, subprocess
          out="dist/_publish"
          files=[]
          for p in sorted(glob.glob(os.path.join(out,"*"))):
              if p.endswith(".json"): continue
              h=hashlib.sha256(open(p,'rb').read()).hexdigest()
              files.append({"name":os.path.basename(p),"size":os.path.getsize(p),"sha256":h})
          mod=os.environ.get("MODULE_VERSION","")
          repo=os.environ.get("GITHUB_REPOSITORY","")   # apk_url 要用（APK 挂在 Release 上）

          # 模块**两变体**（docs/module-variants.md §2.6）：
          #   · full（默认名不带后缀）= 自带 DSH：装完重启即可用
          #   · bare（-bare.zip）      = 不含 DSH：一条指令从官方频道装
          # App 的「更新模块」与下载页都按 `modules.default` 取，**不再靠"第一个 .zip"**
          # （字典序里 `-bare.zip` 排在 `.zip` 前面，那样默认会拿到不带 DSH 的那个）。
          modzips=[f for f in files if f["name"].startswith("sunsetlinux-module-") and f["name"].endswith(".zip")]
          def mod_variant(n):
              return "bare" if n.endswith("-bare.zip") else "full"
          default_mod=next((f for f in modzips if mod_variant(f["name"])=="full"), None)
          modules={
              "default": default_mod["name"] if default_mod else None,
              "variants": [
                  {"id": mod_variant(f["name"]), "name": f["name"], "size": f["size"],
                   "sha256": f["sha256"], "default": default_mod is not None and f["name"]==default_mod["name"]}
                  for f in modzips
              ],
          }

          # App 版本（唯一事实源：app/version.properties）
          appver=""
          for line in open("app/version.properties", encoding="utf-8"):
              if line.strip().startswith("versionName="):
                  appver=line.split("=",1)[1].strip()
          # 四个内置组合的元数据：**从 variants.json 读**（不在工作流里再抄一份），
          # 再和实际产出的 APK 对上 —— 下载页/App 靠它说明"这个包内嵌了什么"。
          variants=[]
          spec=json.load(open("tools/offline-bundle/variants.json", encoding="utf-8"))
          for vid, v in (spec.get("variants") or {}).items():
              apk=next((f for f in files if f["name"].endswith(f"-{vid}-debug.apk")), None)
              variants.append({
                  "id": vid,
                  "label": v.get("label",""),
                  "embed": v.get("embed", []),
                  "note": v.get("note",""),
                  "apk": apk["name"] if apk else None,
                  # ★ APK 挂在 Release 上（不是 gh-pages）：内嵌离线包后单文件可到 114 MB，
                  #   超过 git/Pages 的 100 MB 限制。下载页与 App 都用这个绝对地址。
                  "apk_url": (f"https://github.com/{repo}/releases/download/v{appver}/{apk['name']}"
                              if (apk and appver) else None),
                  "apk_size": apk["size"] if apk else None,
                  "apk_sha256": apk["sha256"] if apk else None,
                  # 离线包挂在 Release 上（不在 gh-pages），名字按约定拼
                  "bundle": f"SunsetLinux-{appver}-{vid}.bin" if appver else None,
              })

          data={
            "schema":1,
            "channel":os.environ.get("CHANNEL_DIR",""),
            "built_at":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "commit":os.environ.get("GITHUB_SHA",""),
            "run_number":int(os.environ.get("GITHUB_RUN_NUMBER","0") or 0),
            # ★ 「编译只在 CI」的可判定形式（docs/module-variants.md §3.2）：
            #   index.json 是发布的唯一入口，把"谁编的"写进去 —— 本地产物即使被手工塞进
            #   gh-pages，也能一眼看出它不是 CI 出的（本发布路径本身只在 Actions 里跑）。
            "built_in_ci":os.environ.get("GITHUB_ACTIONS")=="true",
            "builder":"github-actions" if os.environ.get("GITHUB_ACTIONS")=="true" else "unknown",
            "app_version":appver,
            "github_release_tag":f"v{appver}" if appver else None,
            "module_version":mod,
            "modules":modules,
            "variants":variants,
            "files":files,
          }
          json.dump(data, open(os.path.join(out,"index.json"),"w"), indent=2, ensure_ascii=False)
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY
        env:
          CHANNEL_DIR: ${{ steps.ch.outputs.dir }}

      # 人看的下载页。为什么需要它：gh-pages 上只有 index.json / APK / 模块 zip，
      # 没有 index.html —— 于是：
      #   · 站点根 https://<owner>.github.io/<repo>/ 直接 404（用户第一反应就是点这里）
      #   · /stable/ 会被 Pages 当成 index.json 返回，浏览器里是一坨 JSON
      # 所以每次发布都生成一个自包含的 index.html（内联 CSS、零外部资源、深色单色），
      # 顺手再生成一份站点根页面（只在 stable 通道生成，免得 beta 覆盖它）。
      # 人看的下载页。为什么需要它：gh-pages 上只有 index.json / APK / 模块 zip，
      # 没有 index.html —— 于是站点根 404、/stable/ 直接返回一坨 JSON。
      # 所以每次发布都生成一个自包含的 index.html（内联 CSS、零外部资源、深色单色）。
      #
      # ★ 页面结构按"四个内置组合"重画（2026-09-16）：
      #   四个 APK 都是同一个 App，区别只在**内嵌了什么**（proot / Ubuntu / dsh）。
      #   以前只有一个下载按钮，用户根本不知道哪个包该下 —— 现在每个组合一张卡，
      #   写明"内嵌什么 + 多大 + sha256"，并给出对应的离线包（.bin，挂在 Release 上）。
      - name: 生成下载页（通道页 + 站点根页）
        env:
          CHANNEL_DIR: ${{ steps.ch.outputs.dir }}
          CHANNEL_LABEL: ${{ steps.ch.outputs.label }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, html

          out = "dist/_publish"
          ch = os.environ.get("CHANNEL_DIR", "")
          label = os.environ.get("CHANNEL_LABEL", ch)
          idx = json.load(open(os.path.join(out, "index.json"), encoding="utf-8"))
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          site = f"https://{repo.split('/')[0].lower()}.github.io/{repo.split('/')[-1]}" if repo else ""
          rel = f"https://github.com/{repo}/releases"
          tag = idx.get("github_release_tag") or ""
          reltag = f"{rel}/tag/{tag}" if tag else rel
          bundle_base = f"{rel}/download/{tag}" if tag else rel

          appver = idx.get("app_version") or ""
          mod = idx.get("module_version", "")
          files = idx.get("files", [])
          variants = idx.get("variants", [])
          modzip = next((f for f in files if f["name"].endswith(".zip")), None)
          by_name = {f["name"]: f for f in files}
          mods = idx.get("modules") or {}
          modvariants = mods.get("variants") or []
          moddefault = mods.get("default")

          def human(n):
              n = float(n or 0)
              for u in ("B", "KiB", "MiB", "GiB"):
                  if n < 1024 or u == "GiB":
                      return f"{n:.0f} {u}" if u == "B" else f"{n:.1f} {u}"
                  n /= 1024.0

          PARTS_CN = {
              "base": "Ubuntu 基础层",
              "runtime": "运行层（Node + 工具）",
              "dsh": "DSH 本体 + web profile",
              "proot": "proot 运行时（免 root 用）",
          }

          CSS = """
          :root{color-scheme:dark}
          *{box-sizing:border-box}
          body{margin:0;background:#0A0A0A;color:#F5F5F5;
            font:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC",sans-serif;
            line-height:1.6;-webkit-text-size-adjust:100%}
          main{max-width:760px;margin:0 auto;padding:28px 20px 64px}
          h1{font-size:26px;margin:0 0 4px;letter-spacing:.5px}
          h2{font-size:15px;margin:30px 0 10px;color:#A3A3A3;font-weight:600}
          .sub{color:#A3A3A3;font-size:13px;margin:0 0 22px}
          .sub code{color:#F5F5F5}
          a{color:#F5F5F5}
          .btn{display:block;padding:15px 18px;margin:10px 0;border:1px solid #3D3D3D;border-radius:16px;
            background:#141414;text-decoration:none;font-size:16px}
          .btn.primary{background:#F5F5F5;color:#000;border-color:#F5F5F5;font-weight:600}
          .btn small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:3px}
          .btn.ghost{background:transparent;font-size:14px;padding:11px 18px}
          .card{border:1px solid #2A2A2A;border-radius:16px;padding:16px 18px;margin:12px 0;background:#0F0F0F}
          .card h3{margin:0 0 2px;font-size:17px}
          .card .tagline{color:#A3A3A3;font-size:13px;margin:0 0 10px}
          .card .kv{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6E6E6E;
            margin:8px 0 0;word-break:break-all}
          .chips{margin:0 0 12px}
          .chip{display:inline-block;border:1px solid #3D3D3D;border-radius:999px;padding:2px 9px;
            font-size:11px;color:#A3A3A3;margin:0 6px 6px 0}
          .card a.dl{display:inline-block;padding:10px 16px;border-radius:999px;background:#F5F5F5;
            color:#000;font-weight:600;text-decoration:none;font-size:14px}
          .card a.alt{display:inline-block;margin-left:10px;font-size:12px;color:#A3A3A3}
          ol{padding-left:22px;margin:0}
          li{margin:6px 0}
          table{width:100%;border-collapse:collapse;font-size:12px;font-family:ui-monospace,Menlo,monospace}
          th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #2A2A2A;word-break:break-all}
          th{color:#6E6E6E;font-weight:500}
          .note{color:#6E6E6E;font-size:12px;margin-top:18px}
          .tag{display:inline-block;border:1px solid #3D3D3D;border-radius:999px;padding:2px 10px;font-size:12px;color:#A3A3A3}
          """

          def page(title, subtitle, body):
              return ("<!doctype html>\n<html lang=\"zh-CN\"><head><meta charset=\"utf-8\">\n"
                      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
                      f"<title>{html.escape(title)}</title><style>{CSS}</style></head><body><main>\n"
                      f"<h1>SunsetLinux</h1>\n<p class=\"sub\">{subtitle}</p>\n{body}\n"
                      "<p class=\"note\">层镜像（base / runtime / dsh）走频道分发：App「内置官方频道」，"
                      "或终端里 <code>linuxctl update</code>。本页由 CI 生成（每次发布重写），别手工改 gh-pages。</p>\n"
                      f"<p class=\"note\"><a href=\"https://github.com/{repo}\">仓库</a> · "
                      f"<a href=\"{rel}\">Releases 发布页</a>（离线包 <code>.bin</code> 挂在那里） · "
                      f"<a href=\"{site}/channel/channel.json\">频道清单</a></p>\n"
                      "</main></body></html>\n")

          # ---- 四个内置组合 ----
          cards = []
          for v in variants:
              apk = by_name.get(v.get("apk") or "")
              chips = "".join(f'<span class="chip">{html.escape(PARTS_CN.get(p, p))}</span>' for p in v.get("embed", []))
              apk_href = v.get("apk_url") or (apk or {}).get("name") or ""
              if apk:
                  dl = (f'<a class="dl" href="{html.escape(apk_href)}">下载 APK'
                        f'（{human(apk["size"])}）</a>')
              else:
                  dl = '<span class="tagline">本次没有产出这个组合</span>'
              alt = ""
              if v.get("bundle") and tag:
                  alt = (f'<a class="alt" href="{html.escape(bundle_base)}/{html.escape(v["bundle"])}">'
                         f'离线包 {html.escape(v["bundle"])}</a>')
              sha = f'<p class="kv">sha256 {html.escape((apk or {}).get("sha256",""))}</p>' if apk else ""
              cards.append(
                  f'<div class="card"><h3>{html.escape(v.get("label") or v.get("id"))}</h3>'
                  f'<p class="tagline">{html.escape(v.get("note") or "")}</p>'
                  f'<div class="chips">{chips}</div>{dl}{alt}{sha}</div>')

          # ---- 模块（两变体：默认 full 自带 DSH / bare 不含 DSH）----
          MOD_DESC = {
              "full": "自带 DSH：装完重启即可用（默认版本；可更新、可一键回滚到内置版本）",
              "bare": "不含 DSH：DSH 用一条指令从官方频道装（linuxctl dsh install）",
          }
          modcard = ""
          if modvariants:
              parts = []
              if not moddefault:
                  parts.append('<div class="card"><p class="tagline">⚠️ 本次<b>没有</b>默认模块（full，自带 DSH）：'
                               '频道里暂时没有 dsh 层。下面的 bare 包不含 DSH，装完需要联网从频道装。</p></div>')
              for mv in modvariants:
                  f = by_name.get(mv.get("name") or "") or {}
                  is_def = bool(mv.get("default"))
                  tag = ' <span class="tag">默认</span>' if is_def else ""
                  parts.append(
                      f'<div class="card"><h3>KernelSU 模块 {html.escape(str(mod))} · {html.escape(str(mv.get("id","")))}'
                      f'{tag}</h3>'
                      f'<p class="tagline">{html.escape(MOD_DESC.get(mv.get("id",""), ""))}</p>'
                      f'<a class="dl" href="{html.escape(str(mv.get("name") or ""))}">下载模块 zip'
                      f'（{human(mv.get("size") or f.get("size") or 0)}）</a>'
                      f'<p class="kv">sha256 {html.escape(str(mv.get("sha256","")))}</p></div>')
              modcard = "\n".join(parts)
          elif modzip:
              modcard = (f'<div class="card"><h3>KernelSU 模块 {html.escape(str(mod))}</h3>'
                         f'<p class="tagline">装完<b>重启一次</b>：模块负责开机自启与设备侧构建入口。</p>'
                         f'<a class="dl" href="{html.escape(modzip["name"])}">下载模块 zip'
                         f'（{human(modzip["size"])}）</a></div>')

          rows = "".join(
              f'<tr><td>{html.escape(f["name"])}</td><td>{human(f["size"])}</td>'
              f'<td>{html.escape(f["sha256"])}</td></tr>' for f in files)

          other = "beta" if ch == "stable" else "stable"
          subtitle = (f'<span class="tag">{html.escape(label)}</span> '
                      f'App <code>{html.escape(appver)}</code> · 模块 <code>{html.escape(str(mod))}</code> · '
                      f'commit <code>{html.escape(idx.get("commit","")[:7])}</code> · '
                      f'构建于 {html.escape(idx.get("built_at",""))} · run #{idx.get("run_number","")}')
          body = ("<h2>① 装 App（两个可共存的 App × 三档内置＝六个包，选一个）</h2>\n"
                  "<p class=\"sub\"><b>Root 版</b>与<b>免 root 版</b>是两个不同的 App（包名不同，"
                  "可以同时装、互不影响）；<b>同一个 App 内</b>换档位 = 覆盖安装另一个 APK，数据不丢。</p>\n"
                  "<p class=\"sub\">APK 放在 <b>GitHub Releases</b>（内嵌环境后单文件可到 114 MB，"
                  "超过 Pages 的 100 MB 上限）；模块 zip 与 index.json 仍在站内。</p>\n"
                  + "\n".join(cards) +
                  "\n<h2>② 装 KernelSU 模块（<b>只有 Root 版需要</b>）</h2>\n" + modcard +
                  "\n<h2>③ 起环境</h2>\n"
                  "<ol><li><b>免 root 版</b>：装完打开 App 就会自动铺好内置环境并落到终端"
                  "（不需要 root、不需要模块、不需要联网）。</li>"
                  "<li><b>Root 版</b>：装 App + 刷模块（推荐默认那个，<b>自带 DSH</b>）→ <b>重启一次</b>："
                  "模块会开机自建 base/runtime，DSH 那一层已经随模块就位。</li>"
                  "<li>选了<b>最小档</b>（APK 不带环境）：去 App「更新」页从官方频道装层，"
                  "或下载卡片里的离线包 <code>.bin</code> 在 App 里导入。</li>"
                  "<li>终端自检：<code>linuxctl doctor</code>；只更新 DSH：<code>linuxctl dsh install</code>"
                  "（一条指令，从内置官方频道，验签失败即拒绝）。</li></ol>"
                  "\n<h2>文件与校验</h2>\n<table><tr><th>文件</th><th>大小</th><th>sha256</th></tr>"
                  + rows + "</table>"
                  + f'\n<p class="note">另一个通道：<a href="../{other}/">{other}</a></p>')
          open(os.path.join(out, "index.html"), "w", encoding="utf-8").write(
              page(f"SunsetLinux · 下载（{ch}）", subtitle, body))

          # ---- 站点根页（只在 stable 生成；beta 发布不碰它，免得来回覆盖）----
          if ch == "stable":
              root = "dist/_root"
              os.makedirs(root, exist_ok=True)
              names = "、".join(html.escape(v.get("label") or v.get("id")) for v in variants) or "四个内置组合"
              rbody = (
                  f'<a class="btn primary" href="stable/">正式版（stable）'
                  f'<small>App {html.escape(appver)} · 模块 {html.escape(str(mod))} · 当前推荐</small></a>\n'
                  '<a class="btn" href="beta/">预发布版（beta）<small>下一版候选，可能不稳定</small></a>\n'
                  '<h2>这是什么</h2>\n'
                  '<ol><li>Android 上的真 chroot + overlayfs Ubuntu 24.04 环境，跑原生 DSH。</li>'
                  '<li>装 App + KernelSU 模块，即可在手机上得到完整的 DSH 运行环境。</li>'
                  f'<li>App 有四个包（{names}）：内嵌得越多，装完越不需要联网（APK 在 Releases 页）。</li></ol>')
              open(os.path.join(root, "index.html"), "w", encoding="utf-8").write(
                  page("SunsetLinux · 下载", "Android 上的原生 DSH 运行环境", rbody))
          print("已生成 dist/_publish/index.html" + (" 与 dist/_root/index.html" if ch == "stable" else ""))
          PY

      # ── 频道清单：从 channel 分支取回 → 公钥独立验签 → 与通道产物合并成**一次**推送 ──
      #   这三步原来在 pipeline.yml 的 ⑥ channel job 里（它现在已经不推 gh-pages 了）。
      - name: 取回 channel 分支（签名清单 + 签名 + 公钥）
        # ★ 刻意 continue-on-error：channel 分支拿不到**不该**挡住其它产物
        #   （APK / 模块 zip / index.json / Release）。缺了就由下一步报"验签不通过"，
        #   再由本 job 末尾那步把整轮变红 —— 与改动前"⑥ 红了、但 /stable/ 已经发出去"
        #   的结果一致。
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: channel
          path: .channel

      - name: 用公钥独立验签频道清单（不过就不带 /channel/）
        id: chan
        run: |
          # ★ 故意**不加 -e**（只 `set -uo pipefail`）：验签失败不在这里把 job 掐掉 ——
          #   其它产物该发的还是要发，由本 job 末尾那个步骤统一报红。
          #   硬约束不变：**未签名 / 签坏的清单绝不发出去**。
          set -uo pipefail
          CH=.channel/channel
          ok=1
          for f in channel.json channel.json.sig channel.pub; do
            [ -f "$CH/$f" ] || { echo "::error::channel 分支缺 $CH/$f（清单/签名/公钥三样都要）"; ok=0; }
          done
          if [ "$ok" -eq 1 ]; then
            # 与改动前 ⑥ 跑的**完全同一条命令**：工具来自当前分支（main），
            # 公钥来自 channel 分支；--no-layers = 不校验层文件（层挂在 Release 上，这里没有）
            node tools/channel/verify.mjs --pub "$CH/channel.pub" --in "$CH/channel.json" \
                 --sig "$CH/channel.json.sig" --no-layers || ok=0
          fi
          if [ "$ok" -eq 1 ]; then
            echo "include=1" >> "$GITHUB_OUTPUT"
            echo "频道清单验签通过 → 本次推送带 /channel/"
          else
            echo "include=0" >> "$GITHUB_OUTPUT"
            echo "::error title=频道清单未通过验签::本轮 gh-pages 推送**不带** /channel/（绝不发出未签名/签坏的清单）；本 job 末尾会因此报红"
          fi

      # 把"要发到 gh-pages 站点的全部内容"在本地拼成**站点根那一层**，一次推上去。
      # ★ 为什么不再用 destination_dir：它会把整棵发布树压进 /stable/，而频道清单必须在
      #   **站点根**的 /channel/ —— App 内置频道、offline-bundle.yml、下载页都读这个绝对地址。
      #   所以改成"本地拼出站点根那一层"，publish_dir 指向它、不带 destination_dir。
      - name: 合成站点根那棵树（通道目录 + /channel/ + 站点根页）
        run: |
          set -euo pipefail
          SITE=dist/_site
          DIR="${{ steps.ch.outputs.dir }}"
          rm -rf "$SITE"; mkdir -p "$SITE/$DIR"
          # 通道目录：除 APK 之外全拷（APK 只挂 Release，见下面 exclude_assets 的注释）
          find dist/_publish -maxdepth 1 -type f -not -name '*.apk' -exec cp -v {} "$SITE/$DIR/" \;
          # 频道清单：**站点根**的 /channel/（不是 <通道>/channel/），验签不过就不带；
          # 不带 = gh-pages 上旧的频道目录原样保留（keep_files 只增不删），不会被清成空目录。
          if [ "${{ steps.chan.outputs.include }}" = "1" ]; then
            mkdir -p "$SITE/channel"
            cp -v .channel/channel/channel.json .channel/channel/channel.json.sig \
                  .channel/channel/channel.pub "$SITE/channel/"
          else
            echo "::warning::本次不带 /channel/（验签未通过或频道文件缺失）：gh-pages 上旧的频道目录保持原样"
          fi
          # 站点根页只在 stable 生成（beta 发布不碰它，免得把"当前推荐版本"覆盖成 beta 的）
          if [ "$DIR" = "stable" ]; then cp -v dist/_root/index.html "$SITE/index.html"; fi
          echo "---- 本次 gh-pages 会更新这些文件 ----"
          find "$SITE" -type f | sort

      # ★★ 整个发布**只推这一次** gh-pages：一次推送 = 一条 Pages 构建（见文件顶部说明）。
      #    推上去的是上面那棵树的**内容**：/<通道>/ + /channel/ + （仅 stable）根页 index.html。
      - name: 发布到 gh-pages（通道目录 + 频道清单 + 站点根页，一次提交）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/_site
          # ★ 没有 destination_dir：publish_dir 的**内容**直接落在 gh-pages 根。
          #   keep_files: true 只增不删 —— 另一个通道（/beta/ 或 /stable/）与站点根页
          #   都保持原样；验签没过时不带 /channel/，旧频道目录也因此原封不动。
          keep_files: true
          # ★ APK **不走 gh-pages**，只挂 Release：内嵌离线包之后
          #   ubuntu-proot-dsh 那份有 114 MB —— 超过 git 单文件 100 MB 硬限，
          #   往 gh-pages 分支推会直接失败（而且 Pages 站点还有 1 GB 上限）。
          #   Release 资产没有这些限制，下载地址也能跨域名（App/CLI 都跟 302）。
          #   ⚠️ 真正"不发 APK"靠上一步不把它们拷进 dist/_site；这里是第二道保险 ——
          #      注意 @actions/glob 的 `*` **不跨 `/`**，所以单写 `*.apk` 只管推的根那一层，
          #      嵌套目录（<通道>/*.apk）要另加 `**/*.apk`。
          exclude_assets: '*.apk,**/*.apk'

      # ── GitHub Releases：给"人看的发布页"（与 gh-pages 双发布，产物是同一份）────
      #   ★ 两类 tag 分工不同，别混：
      #     · `v<App 版本>`（例 v0.2.4）= **产品发布**（本步骤），资产 = APK / 模块 zip / index.json
      #     · `layers-<日期>`            = **层的纯存储**（layers-release.yml），资产 = .erofs.zst/.gz
      #   同一版本重复发布是**幂等**的（Release 在就覆盖资产 + 刷新说明），
      #   所以"只升模块版本"的推送不会把 Releases 页刷成一堆重复条目。
      #   只在 stable 跑：beta 是"下一版候选"，看 /beta/ 就够，不该往 Releases 页塞预发布。
      - name: 发布到 GitHub Releases（仅 stable）
        if: steps.ch.outputs.dir == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="dist/_publish"
          # App 版本从 app/version.properties 读（唯一事实源；构建脚本只读它，不在这里再抄一份）
          APP_VER="$(sed -n 's/^versionName=//p' app/version.properties | head -n1 | tr -d '[:space:]')"
          [ -n "$APP_VER" ] || { echo "::error::读不出 app/version.properties 的 versionName（发布中止）"; exit 1; }
          TAG="v$APP_VER"
          TITLE="SunsetLinux $APP_VER（模块 $MODULE_VERSION）"
          REPO="${{ github.repository }}"
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SITE="https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}"

          # 「推荐装哪个包」**由 variants.json 推**，不在这里写死组合名 ——
          # 0.3.0 拆版时"写死了旧 flavor 名"的地方一共红过三次（单测任务名、变体数、
          # 下载页），所以这里也走事实源：每个 edition 取 tier=full（装完零下载的那档），
          # 找不到就退到该 edition 的任意一档。
          # ⚠️ 必须用 **TAB 分隔**：label 里带空格（"Root 版" / "免 root 版"），
          #    `read` 默认按空白分词会把字段切成两半（实测：APK 名拼成
          #    "SunsetLinux-0.3.0-root root-full-debug.apk"），所以下面配 `IFS=$'\t'`。
          python3 - <<'PY' > dist/_reco.tsv
          import json
          d = json.load(open('tools/offline-bundle/variants.json', encoding='utf-8'))
          vs = d['variants']
          for eid, e in d['editions'].items():
              cand = [k for k, v in vs.items() if v['edition'] == eid and v['tier'] == 'full'] \
                  or [k for k, v in vs.items() if v['edition'] == eid]
              print(eid, e['label_short'], e.get('mode', eid), cand[0] if cand else '', sep='\t')
          PY

          {
            echo "Android 上的原生 DSH 运行环境：真 chroot + overlayfs 的 Ubuntu 24.04，跑原生 DSH。"
            echo ""
            echo "| 组件 | 版本 | 说明 |"
            echo "|---|---|---|"
            echo "| App（APK） | \`$APP_VER\` | **两个可共存的 App**：Root 版 / 免 root 版（包名不同，可同时安装）。同一 App 内换内置档位＝覆盖安装，数据不丢；签名固定（debug 密钥随仓库提交） |"
            echo "| KernelSU 模块 | \`$MODULE_VERSION\` | 用 KernelSU 管理器安装，装完**重启一次**（**只有 Root 版需要**） |"
            echo ""
            echo "### 安装顺序"
            echo ""
            echo "1. 按你的路线装对应的 App（两个包名不同，也可以都装上对比）："
            while IFS=$'\t' read -r _eid _label _mode _v; do
              [ -n "${_v:-}" ] || continue
              _apk="$(ls "$OUT"/SunsetLinux-*"-${_v}-debug.apk" 2>/dev/null | head -n1 || true)"
              _apk="${_apk##*/}"
              [ -n "$_apk" ] || _apk="SunsetLinux-$APP_VER-${_v}-debug.apk"
              echo "   - **$_label**（模式 $_mode）→ 推荐 \`$_apk\`：内嵌 Ubuntu + DSH，装完零下载。"
            done < dist/_reco.tsv
            echo "   （想要最小体积、层从频道装：选对应 App 的「最小版」；纯 root 流走 Root 版，纯免 root 流走免 root 版。）"
            if [ -n "${MODULE_DEFAULT_MISSING:-}" ]; then
              echo "2. **Root 版**：KernelSU 管理器里装 \`sunsetlinux-module-$MODULE_VERSION-bare.zip\`，然后**重启一次**。"
              echo "   ⚠️ 本次**没有默认模块（full，自带 DSH）**（频道里暂时没有 dsh 层）—— 重启后 DSH 用一条指令从官方频道装：\`linuxctl dsh install\`。"
            else
              echo "2. **Root 版**：KernelSU 管理器里装 \`sunsetlinux-module-$MODULE_VERSION.zip\`（**默认版本，自带 DSH**），然后**重启一次**（免 root 版跳过这步）。"
              echo "   想让 DSH 走频道（自己控制版本）就装 \`sunsetlinux-module-$MODULE_VERSION-bare.zip\`，重启后用 \`linuxctl dsh install\` 一条指令装。"
            fi
            echo "3. **层镜像**（base / runtime / dsh）不用自己构建："
            echo "   打开 App →「更新」页 → 官方频道 → 一键安装（App 自己解 zstd，约 96 MB，几分钟）；"
            echo "   或从终端按 [Releases \`layers-*\`](https://github.com/$REPO/releases) 里的 gzip 产物手装。"
            echo "4. 启动环境：App 首页点「启动环境」，或 \`/data/sunsetlinux/bin/linuxctl start\`。"
            echo ""
            echo "### 产物与校验"
            echo ""
            echo "| 文件 | 大小 | sha256 |"
            echo "|---|---|---|"
            for f in "$OUT"/*; do
              [ -f "$f" ] || continue
              n="$(basename "$f")"
              sz="$(stat -c '%s' "$f" 2>/dev/null || echo 0)"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              echo "| \`$n\` | $sz | \`$sha\` |"
            done
            echo ""
            echo "### 其他入口"
            echo ""
            echo "- 下载页（同一条通道，含历史说明）：$SITE/stable/"
            echo "- 签名频道清单（App 内置频道读它）：$SITE/channel/channel.json"
            echo "- 层镜像存储（\`layers-*\` tag）：https://github.com/$REPO/releases"
            echo ""
            echo "_本说明由 CI 生成（每次发布重写）；commit \`${{ github.sha }}\`，run #${{ github.run_number }}。_"
          } > dist/_release-notes.md

          # 资产清单：`dist/_publish/` 里除下载页 HTML 之外的全部（index.html 是给 Pages 的，
          # 挂到 Release 上只会让人困惑；下面那句 delete-asset 是给老 Release 清历史的）
          ASSETS=""
          for f in "$OUT"/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in index.html) continue ;; esac
            ASSETS="$ASSETS $f"
          done
          if [ -z "${ASSETS# }" ]; then echo "::error::没有可发布的资产（dist/_publish 是空的？）"; exit 1; fi

          # ① 先把 Release **确保存在**（草稿即可），别把"建条目 + 传 15 个资产"塞进一次调用。
          #    为什么拆开（2026-09-17 真实事故）：15 个资产一次性交给 `gh release create`，
          #    其中一个（`SunsetLinux-0.3.10-proot-base.bin`，69 MB、文件本身没问题 —— 同一次
          #    生成的 index.json 里它在、大小与 sha256 都正常）返回 `HTTP 422 Validation Failed`，
          #    于是**整条发布红掉**；而 gh 在有资产时的行为是"**先建草稿 → 传资产 → 最后才发布**"，
          #    所以 Release 被留在**草稿**态：用户看不到它，而 gh-pages 上（上一步已成功）
          #    已经挂着 0.3.10 的下载链接 ⇒ 那些 APK/.bin 链接当场 404。
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT_STATE="$([ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ] && echo 草稿 || echo 已发布)"
            echo "Release $TAG 已存在（$DRAFT_STATE）→ 覆盖资产 + 刷新说明（幂等，不新建条目）"
          else
            echo "新建 Release $TAG（先建草稿，资产传完再发布）"
            gh release create "$TAG" --draft --title "$TITLE" --notes-file dist/_release-notes.md
          fi

          # ② 资产**逐个上传 + 重试**，已在 Release 上且**内容一致**的直接跳过。
          #    真因（0.3.10 那次 CI 日志原文）：
          #      `新建 Release v0.3.10` →（17 分钟后）`HTTP 422 … name=…proot-base.bin`
          #      → `ReleaseAsset.name already exists`
          #    也就是 gh 在"一次 create 带 15 个资产"时**自己重传了同一个资产**（第一次其实
          #    已在服务端成功、客户端超时后重试）⇒ 撞名 422 ⇒ 整条发布红掉。
          #    所以：① 逐个传、失败重试；② `--clobber` 让"重传撞名"变成覆盖而不是报错；
          #    ③ 已经有且一致的跳过（重跑少传 ~660 MB，也少一次踩同一个坑的机会）。
          #    ⚠️ 不吞错误：四次都失败仍然报红，并把 gh 的原文打出来。
          ERR="$(mktemp)"
          FAILED=""
          SKIPPED=0
          HAVE="$(gh release view "$TAG" --json assets \
                  -q '.assets[] | "\(.name)\t\(.size)\t\(.digest // "")"' 2>/dev/null || true)"
          # shellcheck disable=SC2086
          for f in $ASSETS; do
            n="${f##*/}"
            sz="$(stat -c '%s' "$f" 2>/dev/null || echo '?')"
            # gh 报的 digest 形如 `sha256:…`；拿不到 digest 的资产一律重传（不比大小就跳过）
            dig="sha256:$(sha256sum "$f" | awk '{print $1}')"
            if [ -n "$HAVE" ] && printf '%s\n' "$HAVE" | grep -qxF "$(printf '%s\t%s\t%s' "$n" "$sz" "$dig")"; then
              echo "  已在 Release 上且内容一致，跳过 $n（$sz B）"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            ok=""
            for try in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber 2>"$ERR"; then ok=1; break; fi
              echo "::warning::上传 $n 第 $try 次失败：$(tail -n1 "$ERR" 2>/dev/null)"
              sleep $((try * 10))
            done
            if [ -n "$ok" ]; then
              echo "  已上传 $n（$sz B）"
            else
              echo "::error::资产上传失败（已重试 4 次）：$n —— $(tail -n1 "$ERR" 2>/dev/null)"
              FAILED="$FAILED $n"
            fi
          done
          rm -f "$ERR"
          echo "资产处理完成：跳过 $SKIPPED 个（已在且一致）"
          [ -z "$FAILED" ] || { echo "::error::以下资产没能上传：$FAILED"; exit 1; }

          # ③ 资产齐了才**发布**（`--draft=false` 幂等）。
          #    这一步同时负责修复"上一次失败把 Release 留在草稿态"的历史 ——
          #    没有它，重跑只会给一个草稿反复覆盖资产，用户永远看不到这个版本。
          gh release edit "$TAG" --draft=false --title "$TITLE" --notes-file dist/_release-notes.md

          # 清历史遗留资产名（换命名后它们不该继续出现在 Release 上，否则用户会下错）
          for legacy in index.html sunsetlinux-launcher-debug.apk \
                        minimal.bin minimal.json ubuntu.bin ubuntu.json \
                        ubuntu-proot.bin ubuntu-proot.json \
                        ubuntu-proot-dsh.bin ubuntu-proot-dsh.json; do
            gh release delete-asset "$TAG" "$legacy" --yes >/dev/null 2>&1 || true
          done

          # ★ 撤掉**旧版本**的模块 zip：只升模块版本时 Release 是同一个 tag（幂等覆盖），
          #   而模块资产名里带版本 → 1.0.23 与 1.0.24 会同时躺在 Release 页上。
          #   下载页只列当前版本（它读 dist/_publish），但人在 Release 页会看到全部资产，
          #   很容易下到上一版模块（模块必须与当前运行时对齐，下错会得到一份"看起来能装"的旧包）。
          #   只删 `sunsetlinux-module-*` 且版本不是当前版本的那些，其他资产一律不碰。
          if [ -n "${MODULE_VERSION:-}" ]; then
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
                       | grep '^sunsetlinux-module-' || true); do
              case "$a" in
                *"-${MODULE_VERSION}.zip"|*"-${MODULE_VERSION}-bare.zip"|*"-${MODULE_VERSION}.zip.sha256"|*"-${MODULE_VERSION}-bare.zip.sha256")
                  continue ;;
              esac
              echo "撤掉旧模块资产：$a"
              gh release delete-asset "$TAG" "$a" --yes >/dev/null 2>&1 || true
            done
          fi
          echo "- Release：https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # 失败时把"最后跑的那一步 + 它输出里的报错行"带成注释。
      # 注释是匿名可读的（check-runs/annotations），日志不是 —— 手机上排查 CI 全靠它。
      - name: 失败诊断（把日志尾部带成注释）
        if: failure()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/ci-steps.log"
          echo "---- 日志尾部（最后 40 行）----"
          tail -n 40 "$LOG" 2>/dev/null || echo "（没有日志文件）"
          detail="$(grep -aiE '(^|[^a-z])(error|fatal|failed|denied|not found|No such file|unbound|invalid)([^a-z]|$)' "$LOG" 2>/dev/null | tail -n 6 | tr '\n' '~' | cut -c1-1200)"
          [ -n "$detail" ] || detail="$(tail -n 6 "$LOG" 2>/dev/null | tr '\n' '~' | cut -c1-1200)"
          echo "::error title=发布失败（日志尾部）::$detail"

      - name: 输出下载地址
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.repository }}"
          DIR="${{ steps.ch.outputs.dir }}"
          {
            echo "### ${{ steps.ch.outputs.label }} 已发布"
            echo ""
            echo "- 目录：\`$DIR/\`"
            echo "- 索引：$SITE/$DIR/index.json"
            echo "- 模块版本：\`$MODULE_VERSION\`"
            if [ "${{ steps.chan.outputs.include }}" = "1" ]; then
              echo "- 频道清单：$SITE/channel/channel.json（本轮与上面这些**一次推送**同时更新）"
            else
              echo "- 频道清单：⚠️ 本轮**没有**更新（验签未通过）—— $SITE/channel/channel.json 仍是上一版"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ★ 验签没过：这一轮**必须红**（硬约束：绝不发未签名 / 签坏的清单），
      #   但其它产物已经发出去了（这与改动前"⑤ 成功发 /stable/、⑥ 因验签失败而红"一致）——
      #   所以把"红"放在**最后一步**：通道目录与 Release 照常完成，这里再明确报错。
      #   写成 `steps.chan.outcome == 'success'` 是有意的：如果 job 更早就因为别的原因硬失败、
      #   这一步根本没跑（outcome = skipped），就不要在这里再报一条误导性的"验签失败"。
      - name: 频道清单未通过验签 → 本轮报红
        if: always() && steps.chan.outcome == 'success' && steps.chan.outputs.include != '1'
        run: |
          echo "::error title=频道清单未通过验签::gh-pages 上 /channel/ **保持旧内容未更新**（这是刻意的：绝不发出未签名/签坏的清单）。修好 channel 分支的 channel.json / channel.json.sig / channel.pub 后重跑本工作流（或单独跑 channel.yml 重新签名）"
          exit 1

# ---------------------------------------------------------------------------
# 三层镜像 / 签名频道：**不在本工作流里**
#
# 原因：三层两式约 150 MB，且构建需要 arm64 + 真 chroot（runner 是 x86-64，要 qemu）。
# 每次推送都重建既慢又浪费，而且层的日常增量本来就由频道机制承担
# （用户升级只下变化的层，如 dsh 层约 31 MB）。
#
# 做法：在有 arm64 的机器（或本机）执行 `rootfs/build-layers.sh`，
# 再 `sunsetlinux-channel gen-manifest → sign`，把 channel.json / .sig 与层文件
# 手动放到 gh-pages 的同一目录下即可。签名私钥只应存在于你的离线备份与
# 仓库 Secret `CHANNEL_SIGNING_KEY`，**绝不提交**。
#
# ★ 但**发布频道清单本身**是本工作流的事（③ 验签 + ④ 与通道产物一次推）。
#   推荐路径仍然是：把清单提交到 channel 分支 → channel.yml 签名并提交 .sig →
#   下一轮流水线发布时，本工作流从 channel 分支取"已签名"的三件套一起推上去。
#   手工直接往 gh-pages 放清单只用于"层还没上、临时救急"，注意那会多出一次推送
#   （多一条 Pages 构建），而且绕过了验签门禁。
# ---------------------------------------------------------------------------
