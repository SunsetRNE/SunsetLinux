# ============================================================================
# SunsetLinux 流水线（**一条到底**：环境准备 → 多节点编译 → 合并 → 多重发布）
#
#   推 **main** 或手动触发时，**只有本工作流会跑**（其余工作流都改成手动/可复用）。
#   `beta` 等分支只存内容：要出 beta 预发布就手动跑本工作流并把 channel 选成 beta
#   （决策 3，见 docs/module-variants.md §三）。
#
#   ① prep    环境准备：读版本 + 由 variants.json 生成编译矩阵 + 打模块 zip
#   ② bundles 环境准备：内嵌离线包（六个变体各一份 .bin）+ 默认模块（full，自带 DSH）
#   ③ build   编译矩阵：**一个组合一个节点**（并行；单组合失败不影响其它组合）
#   ④ gates   回归门禁：shell(bash+mksh) / node / App 单测（与编译并行）
#   ⑤ publish 合并产物 → index.json → 下载页 → **一次**推 gh-pages（/stable|beta/ + /channel/ + 根页）→ Release
#   ⑥ channel 频道验签：用公钥独立验签 channel 分支上的签名清单（**只验签、不推 gh-pages**）
#   ⑦ report  汇总（谁红谁绿一眼看到）
#
# 与以前（ci.yml + release.yml + offline-bundle.yml 三条线靠**时间**对齐）的区别：
#   · 顺序由 `needs` 保证，不再靠"等 6 分钟看 Release 出现没有"；
#   · 内嵌离线包只打一次（以前每个组合的构建都可能各拉一遍）；
#   · 模块 zip 在**编译之前**产出（否则 APK 里没有 assets/module/，用户点
#     「一键刷入内置模块」只会看到"未内嵌"——0.2.12 发布时真发生过）。
#
# ── gh-pages 推送次数：**为什么必须一次推**（2026-09-17 改）────────────────────
#   GitHub Pages 是「分支推送驱动」的：**每推一次** gh-pages 就起一次
#   `pages build and deployment`。同一轮发布推两次，就会出现两条 Pages 构建，
#   后一条把前一条取代，前一条只是噪声（历史记录成对出现：`#114 取消/#115 成功`、
#   `#118 取消/#119 成功`、`#120 取消/#121 成功`、`#126 失败/#127 成功`）。
#
#   改之前，一轮 stable 发布实际推了**三次** gh-pages（= 三条 Pages 构建）：
#     · ⑤ publish 的 `/stable/`
#     · ⑤ publish 的站点根页 `/index.html`（仅 stable）
#     · ⑥ channel 的 `/channel/`（同步 channel 分支上的签名清单）
#   现在 ⑥ 不再推送，`/channel/` 由 ⑤ 与上面那些内容合成**一次提交**一起推
#   （见 publish.yml 顶部与其中"合成站点根那棵树"那一步）：
#   **一轮发布 = 一次推送 = 一条 Pages 构建**。
#
#   仍然**各自独立推 gh-pages** 的手动/独立入口（保持原样，都不在流水线路径上；
#   它们各自一次运行 = 一条 Pages 构建，这是它们自己的事）：
#     · channel.yml        —— channel 分支的 channel.json 变化时：签名 + 验签 + 发 /channel/
#     · layers.yml         —— 手动跑（自建 arm64 runner）：可选发 /channel/
#     · layers-release.yml —— 只往 Releases 传层文件，**完全不碰 gh-pages**
#   ⚠️ 往后再往站点加东西：拼进 publish.yml 的 dist/_site/，**不要**在流水线里加第二次推送。
#
# 手动兜底：release.yml（workflow_dispatch）走的还是同一批可复用工作流。
# 层镜像（base/runtime/dsh）**不在这里**：需要 arm64 + 真 chroot，见 layers.yml。
# ============================================================================
name: 流水线

on:
  push:
    # ★ 只有 `main` 触发编译与发布（docs/module-variants.md §3）：
    #   "编译只在 CI 跑、发布只由 main 触发"，`beta` 从此只是**内容存储**
    #   （要出 beta 预发布就手动 workflow_dispatch，并把 channel 选成 beta）。
    branches: [main]
    # 纯文档改动不发布：产物不会变，重跑一次完整构建纯属浪费。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/channel.yml'   # 频道签名由 channel 分支触发
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（stable = 正式；beta = 预发布，只能这样触发）'
        type: choice
        options: [auto, stable, beta]
        default: auto
      embed_bundles:
        description: '内嵌离线包（关掉 = APK 更小、装完需联网装层）'
        type: boolean
        default: true
      # ★ 下面三个是"手动兜底"参数，都会被 tools/ci-changeset.mjs **校验**（非法直接拒，
      #   不猜、不白跑）：force_build=忽略变更集强制编译；force_publish=忽略"版本没变"强制发布
      #   （注意：版本确实没变时它会被**拒绝**，因为"重发同一版本"应该重跑上次失败的 job 或用
      #   cleanup，而不是把 1.3 GB 原样再传一遍）；cleanup_pages=清掉 gh-pages 上历史的 .bin
      #   （2026-09-18 之前的版本把 .bin 也塞进了站点，每个版本 660 MB，必须清）。
      force_build:
        description: '强制编译（忽略变更集判定）'
        type: boolean
        default: false
      force_publish:
        description: '强制发布（仅当版本号确实变了才有意义）'
        type: boolean
        default: false
      cleanup_pages:
        description: '清理 gh-pages 上历史的 .bin（一次性维护用）'
        type: boolean
        default: false

# 同一分支的旧运行排队（不取消）：发布是"写到 gh-pages / Release"的动作，
# 中途取消会留下半套产物。真正的写操作还在 publish.yml 里用 group: gh-pages 串行。
concurrency:
  # ★ 分组里带 event_name：手动发布（workflow_dispatch）与日常 push 是**两条独立队列** ——
  #   否则"发布跑到一半时有人推了个文档提交"会把发布整条取消（发布是写 gh-pages/Release 的动作）。
  #   push 之间仍然串行排队（cancel-in-progress: false）。
  group: pipeline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────── ① 环境准备
  prep:
    name: ① 环境准备
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      app_version: ${{ steps.ver.outputs.app_version }}
      module_version: ${{ steps.ver.outputs.module_version }}
      embed_bundles: ${{ steps.norm.outputs.embed_bundles }}
      # 变更集判定（tools/ci-changeset.mjs）：编译/发布**只做该做的**
      build_apks: ${{ steps.plan.outputs.build_apks }}
      build_bundles: ${{ steps.plan.outputs.build_bundles }}
      publish: ${{ steps.plan.outputs.publish }}
      plan_reason: ${{ steps.plan.outputs.reason }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # fetch-depth: 0 —— 变更集要 `git diff <上次发布的 commit> HEAD`；
      # 浅克隆（depth=1）会 diff 不出来，那时判定会退化成"全都变了"（保守但白烧时间）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 归一化输入（push 事件没有 inputs，别被 `'' == false` 坑到）
        id: norm
        run: |
          set -euo pipefail
          # ★ GitHub 表达式的宽松相等：`'' == false` 为**真**。
          #   所以 push 事件下写 `inputs.embed_bundles != false` 会得到"假" ——
          #   表现是"默认该内嵌离线包，却整条 ② 节点被跳过"（这次真踩到）。
          #   这里只算一次，后面统一用 needs.prep.outputs.embed_bundles。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want="${{ inputs.embed_bundles }}"
          else
            want="true"
          fi
          echo "embed_bundles=$want" >> "$GITHUB_OUTPUT"
          echo "内嵌离线包：$want"

      - name: 读版本（app/version.properties + module/module.prop）
        id: ver
        run: |
          set -euo pipefail
          APP="$(sed -n 's/^versionName=//p' app/version.properties | head -n1 | tr -d '[:space:]')"
          MOD="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
          [ -n "$APP" ] || { echo "::error::读不出 app/version.properties 的 versionName"; exit 1; }
          [ -n "$MOD" ] || { echo "::error::读不出 module/module.prop 的 version"; exit 1; }
          echo "app_version=$APP" >> "$GITHUB_OUTPUT"
          echo "module_version=${MOD#v}" >> "$GITHUB_OUTPUT"
          {
            echo "### ① 环境准备"
            echo ""
            echo "- App：\`$APP\`；模块：\`${MOD#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 算出"这次该做什么"（变更集 + 参数校验；判定在 tools/ci-changeset.mjs）
        id: plan
        run: |
          set -euo pipefail
          SITE="https://$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/${GITHUB_REPOSITORY#*/}"
          # 上次**已发布**的版本与 commit：线上 index.json 就是"上次发布之后的世界"。
          # 拿不到就退化成"全都变了/版本变了"（保守：宁可多做一次，也不能漏发）。
          PREV_JSON="$(curl -fsSL --max-time 20 "$SITE/stable/index.json" 2>/dev/null || true)"
          PREV_SRC="站点 stable/index.json"
          # ★ 站点偶发取不到时**不要**直接退化成"全都变了"：那会让一次瞬时的 Pages 抖动触发
          #   整轮重发（1.3 GB 上传，而且**同一个 tag 的字节会被改写** —— 2026-09-18 真发生过：
          #   站点 curl 失败 ⇒ 保守判成"版本变了" ⇒ v0.3.14 的 16 个资产在 04:52 被全部重写）。
          #   先退到 Release 上那份 index.json：它就是同一次发布写出去的，内容等价。
          if [ -z "$PREV_JSON" ]; then
            PREV_JSON="$(curl -fsSL --max-time 20 "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/index.json" 2>/dev/null || true)"
            PREV_SRC="Release latest/index.json"
          fi
          echo "上次发布版本来源：$PREV_SRC"
          # 单行 python（多行 -c 的续行会顶格，把 YAML 块标量提前结束 —— 实测踩过）
          jget() { printf '%s' "$PREV_JSON" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('$1') or '')" 2>/dev/null || true; }
          PREV_APP="$(jget app_version)"
          PREV_MOD="$(jget module_version)"
          PREV_COMMIT="$(jget commit)"
          echo "上次发布：App=$PREV_APP 模块=$PREV_MOD commit=$PREV_COMMIT"

          CHANGED=/tmp/changed.txt
          if [ -n "$PREV_COMMIT" ] && git cat-file -e "${PREV_COMMIT}^{commit}" 2>/dev/null; then
            git diff --name-only "$PREV_COMMIT" HEAD > "$CHANGED"
            echo "变更文件 $(wc -l < "$CHANGED") 个"
          else
            echo "*" > "$CHANGED"
            echo "::warning::拿不到上次发布的 commit（线上 index.json 没有/本地没有该历史）→ 按'全都变了'保守处理"
          fi

          node tools/ci-changeset.mjs \
            --changed-file "$CHANGED" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            --module-version "${{ steps.ver.outputs.module_version }}" \
            --prev-app-version "$PREV_APP" \
            --prev-module-version "$PREV_MOD" \
            --channel "${{ inputs.channel || 'auto' }}" \
            --event "${{ github.event_name }}" \
            --force-build "${{ inputs.force_build || 'false' }}" \
            --force-publish "${{ inputs.force_publish || 'false' }}" \
            --github-output

          # ★ 不变式：**要编 APK、且 APK 要内嵌离线包 ⇒ 离线包必须产出**。
          #   为什么：编译节点是否去取 `offline-bundles` 制品看的是 `embed_bundles`（默认 true），
          #   而 ② 是否产出它看的是变更集的 `build_bundles`（"没改离线包输入就不重打" 的优化）。
          #   两者不一致时，编译节点会去下载一个**不存在的制品** ⇒ 六个节点全红
          #   （2026-09-18 实跑踩到：只改了 app/内核与模块脚本 ⇒ build_bundles=false、embed=true）。
          #   更坏的情况是"跳过去包、发出不带环境的 APK"（0.2.6 事故）。所以这里强制打一次：
          #   代价约 40 秒，比发错包或整轮红都便宜。
          #   注：`build_bundles` 只影响"要不要重打"，不影响"要不要发布"。
          #   ⚠️ 这里**回读 `$GITHUB_OUTPUT`**，不用 `${{ steps.plan.outputs.* }}`：
          #   本条就在 plan 这一步里，GitHub 要等这一步结束才设置它自己的 outputs ⇒
          #   在同一步里引用自己的 outputs 会拿到空串，条件永远为假（那样这层保险就是摆设）。
          #   ⚠️ 两个坑都踩过：
          #     ① `GITHUB_OUTPUT` 是**每步一个文件** ⇒ 在同一步里读**上一步**写的
          #        `embed_bundles` 永远读不到（grep 失败 + `set -e` ⇒ 整步退出 1）。
          #        所以它走上一步的 outputs 表达式。
          #     ② 读自己的 outputs 必须容错（`|| true`）：键不在时 grep 返 1，
          #        在 `set -e` 下会把整步干掉。
          _out_get() { grep "^$1=" "$GITHUB_OUTPUT" 2>/dev/null | tail -n1 | cut -d= -f2- || true; }
          _apks="$(_out_get build_apks)"
          _bundles="$(_out_get build_bundles)"
          _embed="${{ steps.norm.outputs.embed_bundles }}"
          if [ "$_apks" = "true" ] && [ "$_embed" = "true" ] && [ "$_bundles" != "true" ]; then
            echo "::notice::本次要编 APK 且要内嵌离线包 ⇒ 强制重打离线包（避免取不到制品 / 发出不带环境的包）"
            echo "build_bundles=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo ""
            echo "### 变更集判定"
            echo ""
            echo "- ${{ steps.ver.outputs.app_version }} / 模块 ${{ steps.ver.outputs.module_version }}；上次发布 App=$PREV_APP 模块=$PREV_MOD"
            echo "- 结论：见上面 job 日志里的「判定：…」一行"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 由 variants.json 生成编译矩阵（单一事实源）
        id: matrix
        run: |
          set -euo pipefail
          # 组合清单只写在 tools/offline-bundle/variants.json 里（离线包工具、发布页、
          # App 的组合标签都读它）。这里把它翻成 Gradle 任务名：
          #   minimal → MinimalDebug、ubuntu-proot-dsh → UbuntuProotDshDebug
          # 即"按 '-' 分段首字母大写 + Debug"。**新增/改名组合只改 variants.json**。
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open('tools/offline-bundle/variants.json', encoding='utf-8'))
          inc = []
          for vid, spec in v['variants'].items():
              task = ''.join(p[:1].upper() + p[1:] for p in vid.split('-')) + 'Debug'
              inc.append({
                  'id': vid,
                  'task': task,
                  'label': spec.get('label', vid),
                  'embed': spec.get('embed', []),
              })
          print('matrix=' + json.dumps({'include': inc}, ensure_ascii=False))
          PY
          # 再打一份到日志（矩阵是"环境准备"的输出，出问题时第一个要看的就是它）
          python3 -c "import json;d=json.load(open('tools/offline-bundle/variants.json'));print('组合：', ', '.join(d['variants']))"

      - name: 打包模块 zip（APK 内嵌用的 **bare** 变体）
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y -qq zip
          # ★ APK 内嵌 bare（docs/module-variants.md §2.6）：base/full 档 APK 已自带
          #   dsh 层，模块再内嵌一份就是同样的 48 MB 塞两遍。
          #   **默认版本（full，自带 DSH）**由 ② bundles 节点用频道里的 dsh 层打，
          #   产物名走默认名 sunsetlinux-module-<版本>.zip（见 offline-bundle.yml）。
          # 内核 v2 的 dex：先构建再打包（缺了会**出声**，但正式包应当带上）
          if [ -f app/gradlew ]; then
            ( cd app && ./gradlew --no-daemon :sunsetd:jar ) || echo "::warning::sunsetd jar 构建失败，本包将不含内核 v2"
          fi
          node tools/build-sunsetd-dex.mjs || echo "::warning::内核 dex 未构建（本包不含内核 v2）"
          bash module/mkmodule.sh --variant bare
          ls -l dist/sunsetlinux-module-*.zip
          # 有 dex 就必须在包里（防"该进包的没进"）
          if [ -f build/sunsetd/classes.dex ]; then
            unzip -l dist/sunsetlinux-module-*.zip | grep -q 'bin/sunsetd.dex' \
              || { echo "::error::构建出了内核 dex 却没进模块包"; exit 1; }
          fi

      - name: 上传模块 zip（编译节点要用）
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: |
            dist/sunsetlinux-module-*.zip
            dist/sunsetlinux-module-*.zip.sha256
          retention-days: 7

  # ─────────────────────────────────────────────── ② 内嵌离线包
  bundles:
    name: ② 内嵌离线包
    needs: prep
    # 两个条件都要：① 变更集说 .bin 会变；② 输入没关掉"内嵌离线包"
    if: ${{ needs.prep.outputs.embed_bundles == 'true' && needs.prep.outputs.build_bundles == 'true' }}
    # ★ 被调用的 offline-bundle.yml 在工作流级声明了 `contents: write`（它要挂 Release）。
    #   GitHub 的规则是"调用方只能**收紧**、不能收紧到低于被调用方声明的权限"，
    #   不显式授权就会在**计划阶段**直接失败（报 Invalid workflow file，工作流一行都不跑）。
    permissions:
      contents: write
    uses: ./.github/workflows/offline-bundle.yml
    with:
      # 不在这一步等 Release：流水线里 Release 由 ⑤ publish 统一建，
      # 离线包跟着 publish 一起挂（publish.yml 会把 dist/bundles/*.bin 收进资产）。
      attach_release: false

  # ─────────────────────────────────────────────── ③ 编译（矩阵）
  build:
    name: ③ 编译 ${{ matrix.id }}
    needs: [prep, bundles]
    # bundles 被关掉（手动触发时取消勾选 / 判定说 .bin 没变）也要能编译，只是 APK 不带环境
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.build_apks == 'true' && (needs.bundles.result == 'success' || needs.bundles.result == 'skipped') }}
    strategy:
      fail-fast: false          # 一个组合红了，其它组合照常出包（能看出坏在哪一个）
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    uses: ./.github/workflows/build-apk.yml
    with:
      variant: ${{ matrix.id }}
      gradle_task: ${{ matrix.task }}
      bundles_available: ${{ needs.prep.outputs.embed_bundles == 'true' }}
    secrets: inherit            # 签名密钥（没配就各步自己回退到仓库内固定调试密钥）

  # ─────────────────────────────────────────────── ④ 回归门禁（与编译并行）
  gates:
    name: ④ 回归门禁
    uses: ./.github/workflows/ci.yml
    with:
      # 门禁只跑断言与单测：APK 由上面的编译矩阵产出，不在这里重建一遍。
      build_apks: false
      embed_bundles: false
    secrets: inherit

  # ─────────────────────────────────────────────── ⑤ 合并 + 发布
  publish:
    name: ⑤ 合并 + 发布
    needs: [prep, build, gates, bundles]
    # 发布只在"版本号变了"（或手动 force_publish）时跑；build/bundles 被跳过也算通过
    # （跳过的含义是"产物没变"，此时 publish 会把已存在的资产按 sha256 跳过重传）。
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.publish == 'true' && needs.gates.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.bundles.result == 'success' || needs.bundles.result == 'skipped') }}
    # 同理：publish.yml 的 publish job 声明了 `contents: write`（推 gh-pages + 建 Release）
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: ${{ inputs.channel || 'auto' }}
      cleanup_pages: ${{ inputs.cleanup_pages || 'false' }}
    secrets: inherit

  # ─────────────────────────────────────────────── ⑥ 频道验签（**不再推送**）
  #
  # ★ 这里以前是"频道发布"：把 channel 分支上已签名的 channel.json/.sig/.pub 同步到
  #   gh-pages 的 /channel/。那会**再推一次 gh-pages** → 同一轮发布两条 Pages 构建，
  #   后一条取代前一条（`#114 取消/#115 成功`、`#118 取消/#119 成功`、`#126 失败/#127 成功`）。
  #   现在 /channel/ 由 ⑤ publish 与 /stable|beta/、站点根页合成**一次提交**一起推
  #   （publish.yml 顶部有完整说明），本 job 只保留"用公钥独立验签"这一半价值：
  #   换一个 job、重新 checkout 再验一遍 —— 清单没签 / 签坏照样让这一轮变红。
  #
  #   仍会**各自独立推 gh-pages** 的手动入口（都不是日常流水线路径，保持原样）：
  #     · channel.yml —— channel 分支的 channel.json 变化时：签名 + 验签 + 发 /channel/
  #     · layers.yml  —— 手动跑（自建 arm64 runner）：可选发 /channel/
  #   （layers-release.yml 只往 Releases 传层文件，不碰 gh-pages。）
  channel:
    name: ⑥ 频道验签（只验签，不推 gh-pages）
    # ★ 刻意**不写 needs**（尤其不写 `needs: publish`）：这是**独立**的第二条验签路径 ——
    #   ⑤ 里那次验签是"发之前自己核一遍"，这里换 job、换 checkout 再核一遍。
    #   若写成 needs: publish，则在"清单签坏了"的场景里 ⑤ 已经先红、本 job 反而被跳过，
    #   这道门禁就形同虚设。
    runs-on: ubuntu-latest
    # 只读：本 job 不再写 gh-pages（写操作全在 ⑤ publish 的 job 级 concurrency 里串行）。
    # 这里也**不再挂 concurrency: group: gh-pages** —— 不写就没必要占那个组，占了只会
    # 让 ⑤ 的推送白等一次排队。
    permissions:
      contents: read
    steps:
      # 当前分支：要工具（tools/channel/verify.mjs）来独立验签
      - uses: actions/checkout@v4

      # channel 分支：签名清单 + 签名 + 公钥（私钥只在 channel.yml 里用，这里碰不到）
      - uses: actions/checkout@v4
        with:
          ref: channel
          path: .channel

      - name: 用公钥独立验签（没签或签坏就明确失败）
        run: |
          set -euo pipefail
          CH=.channel/channel
          for f in channel.json channel.json.sig channel.pub; do
            [ -f "$CH/$f" ] || { echo "::error::channel 分支缺 $CH/$f（清单/签名/公钥三样都要）"; exit 1; }
          done
          node tools/channel/verify.mjs --pub "$CH/channel.pub" --in "$CH/channel.json" \
               --sig "$CH/channel.json.sig" --no-layers
          echo "验签通过。/channel/ 的内容由 ⑤ publish 与通道产物合成**一次** gh-pages 推送，本 job 不再推送。"

  # ─────────────────────────────────────────────── ⑦ 汇总
  report:
    name: ⑦ 汇总
    # ★ ⑥ 的 job id **刻意保留为 `channel`**（只改了 name）：它的职责从"发布"变成"验签"，
    #   但 id 一改，这里的 needs 与下面 `needs.channel.result` 就得一起改 —— 没必要为
    #   一个显示名去动全流水线的依赖图。
    needs: [prep, bundles, build, gates, publish, channel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        run: |
          {
            echo "## 流水线结果（run #${{ github.run_number }}）"
            echo ""
            echo "| 节点 | 结果 |"
            echo "|---|---|"
            echo "| ① prep | ${{ needs.prep.result }} |"
            echo "| ② bundles | ${{ needs.bundles.result }} |"
            echo "| ③ build | ${{ needs.build.result }} |"
            echo "| ④ gates | ${{ needs.gates.result }} |"
            echo "| ⑤ publish | ${{ needs.publish.result }} |"
            echo "| ⑥ channel（验签） | ${{ needs.channel.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          case "${{ needs.build.result }}" in
            success) ;;
            *) echo "::error title=编译矩阵有节点失败::看 ③ build 里哪个组合红了（注释里带断言原文）"; exit 1 ;;
          esac
          case "${{ needs.gates.result }}" in
            success) ;;
            *) echo "::error title=回归门禁未通过::看 ④ gates 的注释（tools/ci-shell-gate.sh 会带出具体断言）"; exit 1 ;;
          esac
          case "${{ needs.publish.result }}" in
            success) ;;
            skipped) echo "（本次判定不发布：${{ needs.prep.outputs.plan_reason }}）" ;;
            *) echo "::error title=发布失败::看 ⑤ 的注释（publish.yml 里那个 if: failure() 步骤会把日志尾部带出来）"; exit 1 ;;
          esac
          case "${{ needs.build.result }}" in
            skipped) echo "（本次判定不重编 APK：产物字节不会变）" ;;
          esac
          # ★ ⑥ 现在只验签（不再推 gh-pages），它是"清单有没有签/签坏"的唯一独立门禁：
          #   它红了这一轮就必须红 —— ⑤ 里那次验签失败时也只会"不带 /channel/"并报红，
          #   不会有别的节点替它把结果顶出来。
          case "${{ needs.channel.result }}" in
            success) ;;
            *) echo "::error title=频道验签未通过::channel 分支上的 channel.json / channel.json.sig / channel.pub 三样要齐、且能用公钥验过（重签见 channel.yml；发布时 /channel/ 的同步已合并到 ⑤ 里）"; exit 1 ;;
          esac
