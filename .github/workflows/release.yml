# ============================================================================
# 发布（**手动兜底**：调同一批可复用工作流，不重复任何发布逻辑）
#
# 平时**不需要**碰它：推 main / beta 会跑 pipeline.yml（环境准备 → 编译矩阵 → 门禁 →
# 合并发布 → 频道 → 汇总），发布逻辑都在 publish.yml 里。
#
# 这个文件存在的意义只有一个：**出问题时能单独重发一次**。
#   · 只想重新发布（构建产物还在）：直接手动跑 publish.yml 工作流；
#   · 想整条重来一遍：跑本工作流（下面四个节点，与 pipeline.yml 同构）。
#
# ⚠️ 它**不再**监听 push：以前 push main/beta 会同时触发它和 pipeline.yml，
#    两条线都会写 gh-pages / Release（同一个 concurrency 组只能保证不并发，
#    保证不了"只发一次"）。原来的 publish 逻辑已整体搬到 publish.yml（注释一并搬走）。
# ============================================================================
name: 发布（手动兜底）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（auto 按分支：main→stable、beta→beta）'
        type: choice
        options: [auto, stable, beta]
        default: auto
      embed_bundles:
        description: '内嵌离线包（关掉 = APK 更小、装完需联网装层）'
        type: boolean
        default: true

concurrency:
  group: release-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ① 环境准备：模块 zip（APK 内嵌要用）
  prep:
    name: ① 环境准备（模块 zip）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建内核 dex（模块包里必须有 bin/sunsetd.dex）
        # 2026-09-18：以前所有打包路径都漏了这一步 ⇒ 发出去的模块全都不含内核（§3.10.49）。
        run: node tools/build-sunsetd-dex.mjs
      - name: 打包模块 zip（APK 内嵌用的 bare 变体）
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y -qq zip
          # APK 内嵌 bare（docs/module-variants.md §2.6）；默认模块（full）由
          # ② bundles 节点用频道里的 dsh 层打，⑤ publish 会把它一起收进发布。
          bash module/mkmodule.sh --variant bare
      - name: 上传模块 zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: |
            dist/sunsetlinux-module-*.zip
            dist/sunsetlinux-module-*.zip.sha256
          retention-days: 7

  # ② 内嵌离线包（可选）
  bundles:
    name: ② 内嵌离线包
    if: ${{ inputs.embed_bundles != false }}
    # 被调用的 offline-bundle.yml 声明了 contents: write（挂 Release），调用方必须允许
    permissions:
      contents: write
    uses: ./.github/workflows/offline-bundle.yml
    with:
      attach_release: false

  # ③ 门禁 + 四个组合一起编（手动兜底走"独立门禁"那条路：自己把 APK 编出来）
  gate:
    name: ③ 门禁 + 构建
    uses: ./.github/workflows/ci.yml
    with:
      build_apks: true
      embed_bundles: ${{ inputs.embed_bundles != false }}

  # ④ 发布（与 pipeline.yml 的 ⑤ 是同一个文件）
  publish:
    name: ④ 发布
    needs: gate
    # publish.yml 声明了 contents: write（推 gh-pages + 建 Release），调用方必须允许
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: ${{ inputs.channel || 'auto' }}
    secrets: inherit
