# ============================================================================
# 内置（离线）包：从**频道**拉层 → 按组合打包 → 挂到 Release
#
# ## 为什么在 CI 里做（而不是让各人的机器打包）
#   离线包的输入是"已发布的层"，而层已经在 `layers-<日期>` 那个存储 Release 里、
#   并且**签名频道清单**里有每层的 sha256 / sha256_raw。所以打包这件事完全可以
#   在 runner 上做：下载 → 逐层校验 → 拼装 → 上传。构建机不需要 arm64，也不需要私钥。
#
# ## 为什么"下载而不是本地产物"
#   `dist/` 是 gitignore 的，runner 上只有源码；而频道清单是**唯一事实源**
#   （每层都有 sha256/sha256_raw，能当场验）。这样 CI 打出来的包与用户从 App
#   装到的东西**必然同源** —— 不会出现"CI 用旧层打了包"这种漂移。
#
# ## 触发
#   · 改动本工具或本工作流时自动跑（这样改完就能看到产物，不用等发布）；
#   · 也可以手动 workflow_dispatch。
# ============================================================================
name: 内置离线包

on:
  # 由 pipeline.yml 的「② 内嵌离线包」节点调用（同一个 run 里，APK 编译等它产出）。
  # 也可以手动跑（排障 / 单独重建离线包）。
  #
  # ⚠️ 这里**不再**监听 push：以前它和 release.yml 并行跑，靠"等 6 分钟看 Release 出现"
  #    来对齐（offline-bundle 要挂到 Release 上，而 Release 是 release.yml 建的）。
  #    现在顺序由流水线的 needs 保证 —— 见 pipeline.yml 的 ②→③→⑤。
  workflow_call:
    inputs:
      attach_release:
        description: '是否把 .bin 挂到 Release（流水线里传 false：由 ⑤ publish 统一挂）'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      attach_release:
        description: '是否把 .bin 挂到 Release（Release 还不存在时会等 6 分钟）'
        type: boolean
        default: true

permissions:
  contents: write          # 把产物挂到 Release 上

concurrency:
  group: offline-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: 打包六个组合（+ 默认模块 full）并挂到 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 取频道清单并逐层下载 + 校验
        run: |
          set -euo pipefail
          # ⚠️ 注意：`${{ github.repository }}` 是 "owner/repo"，直接拼到 host 后面会变成
          #    https://Owner.github.io/Owner/Repo（多一段）→ 404。这里按 channel.yml 的做法
          #    owner 转小写 + 只取仓库名。
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SITE="https://${OWNER_LC}.github.io/${REPO_NAME}"
          mkdir -p dist/bundles

          # 下载一律走这个函数：失败时**把 URL 与 HTTP 码打出来**（写成 ::error:: 就能在
          # 检查注解里看到，不必翻日志 —— job 日志要 token，检查注解是公开的），
          # 并带重试：线上偶发 5xx/限流不该让整步失败。
          dl() { # dl <url> <输出文件>
            local url="$1" out="$2" code=""
            code="$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
                      -w '%{http_code}' -o "$out" "$url")" && return 0
            local rc=$?
            echo "::error::下载失败 rc=$rc http=${code:-?} url=$url"
            return $rc
          }

          dl "$SITE/channel/channel.json"     dist/channel.json
          dl "$SITE/channel/channel.json.sig" dist/channel.json.sig
          [ -s dist/channel.json ] || { echo "::error::拿不到频道清单（/channel/channel.json）"; exit 1; }

          # 用清单当唯一事实源：文件名按 <id>-<版本>.erofs.zst 落，并顺手生成
          # dist/SHA256SUMS.layers.txt（mk-bundle 会从里面取 sha256_raw/size_raw）
          node - <<'NODE' > dist/layers.tsv
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('dist/channel.json', 'utf8'));
          for (const l of m.layers ?? []) {
            const url = l.url || l.url_gz;
            const sha = l.url ? l.sha256 : l.sha256_gz;
            if (!url || !sha) continue;
            const ext = url.endsWith('.gz') ? 'gz' : 'zst';
            console.log([l.id, l.version, url, sha, ext, l.sha256_raw ?? '', l.size_raw ?? ''].join('\t'));
          }
          NODE
          [ -s dist/layers.tsv ] || { echo "::error::频道清单里没有层"; exit 1; }

          : > dist/SHA256SUMS.layers.txt
          while IFS=$'\t' read -r id ver url sha ext raw rawsize; do
            f="dist/$id-$ver.erofs.$ext"
            echo "下载 $id $ver ← $url"
            dl "$url" "$f"
            got="$(sha256sum "$f" | awk '{print $1}')"
            [ "$got" = "$sha" ] || { echo "::error::$f sha256 与频道清单不符：$got ≠ $sha"; exit 1; }
            # 只有清单里确实带了 raw 值才写进 SHA256SUMS：**绝不填 0 冒充**
            # （填了 App 会拿全零去核对解压结果，必然失败）
            if [ -n "$raw" ] && [ -n "$rawsize" ]; then
              printf '%s-%s.erofs  %s  %s\n' "$id" "$ver" "$rawsize" "$raw" >> dist/SHA256SUMS.layers.txt
            fi
          done < dist/layers.tsv
          echo "层已就绪："; ls -l dist/*.erofs.* | awk '{print "  ", $5, $9}'

      - name: 取 proot 运行时（非 root 组合要用）
        run: |
          set -euo pipefail
          # proot 包不是"层"，走的是 layers 存储 Release 的资产；没有就说明还没发过，
          # 那种情况下含 proot 的组合会被 mk-bundle 明确拒绝（不会静默少一块）。
          URL="$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50" \
                 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const rs=JSON.parse(s);for(const r of rs){if(!String(r.tag_name||"").startsWith("layers-"))continue;const a=(r.assets||[]).find(x=>/^proot-bundle-.*\.tar\.gz$/.test(x.name));if(a){console.log(a.browser_download_url);break}}})' || true)"
          if [ -n "${URL:-}" ]; then
            curl -fsSL "$URL" -o "dist/$(basename "$URL")"
            echo "已取 proot：$(basename "$URL")"
          else
            echo "::warning::layers-20260916 里没有 proot-bundle-*.tar.gz；本次跳过含 proot 的组合"
          fi

      - name: 打包（每个变体打完立刻校验）
        run: node tools/offline-bundle/mk-bundle.mjs --available --dir dist --out dist/bundles

      # 发布的离线包按**定下来的命名**：SunsetLinux-<App 版本>-<组合>.bin
      # （本地/工具产出的中间名是 <组合>.bin；页面与"导入离线包"都认发布名）
      - name: 按发布命名重命名离线包
        run: |
          set -euo pipefail
          APP_VER="$(sed -n 's/^versionName=//p' app/version.properties | head -n1 | tr -d '[:space:]')"
          [ -n "$APP_VER" ] || { echo "::error::读不出 app/version.properties 的 versionName"; exit 1; }
          cd dist/bundles
          for f in *.bin; do
            [ -f "$f" ] || continue
            id="${f%.bin}"
            case "$id" in SunsetLinux-*) continue ;; esac   # 已经是发布名就跳过
            mv -v "$f" "SunsetLinux-$APP_VER-$id.bin"
          done
          # 校验清单（.json）保持同名，只是把 bundle 字段指到新名字
          for j in *.json; do
            [ -f "$j" ] || continue
            id="${j%.json}"
            case "$id" in SunsetLinux-*) continue ;; esac
            python3 - "$j" "$APP_VER-$id.bin" <<'PY'
          import json, sys
          p, newname = sys.argv[1], sys.argv[2]
          d = json.load(open(p, encoding="utf-8"))
          d["bundle"] = newname
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
            mv -v "$j" "SunsetLinux-$APP_VER-$id.json"
          done
          ls -l *.bin

      - name: 回归（合成部件全链路 + 负例）
        run: node tools/offline-bundle/selftest.mjs

      # ── 默认模块（full 变体：自带 DSH）────────────────────────────────────────
      # 为什么在这里做：本节点已经把频道里的层**逐层下载并校验过 sha256**，
      # 而默认模块要的正是 dsh 那一层（docs/module-variants.md §2.1/§2.6）。
      #   · APK 内嵌的是 bare（pipeline 的 ① prep 打的），两者不冲突；
      #   · 默认产物名 `sunsetlinux-module-<版本>.zip` 只给 full —— 拿不到 dsh 层时
      #     **不产出默认名**（绝不把不带 DSH 的包冒充默认版本），并明确说出来。
      - name: 打包**默认模块**（full：内嵌频道里的 dsh 层）
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y -qq zip
          MODV="$(sed -n 's/^version=//p' module/module.prop | head -n1 | tr -d '[:space:]')"
          MODV="${MODV#v}"
          DSH_GZ="$(ls -1 dist/dsh-*.erofs.gz 2>/dev/null | head -n1 || true)"
          if [ -z "$DSH_GZ" ]; then
            # 频道清单里的 `url` 是 **.zst**（体积小 35%）——上面的下载按它落的盘。
            # 但**设备侧没有 zstd**（只有 toybox gzip），模块里必须是 .gz，所以在这里转一次：
            #   · sha256_raw（解压后的内容哈希）**不变**，模块落地时校验的就是它；
            #   · sha256_gz 由 mkmodule 从转出来的文件重算，所以重新压缩是安全的。
            DSH_ZST="$(ls -1 dist/dsh-*.erofs.zst 2>/dev/null | head -n1 || true)"
            if [ -n "$DSH_ZST" ]; then
              command -v zstd >/dev/null 2>&1 || sudo apt-get install -y -qq zstd
              DSH_GZ="${DSH_ZST%.zst}.gz"
              echo "把 $(basename "$DSH_ZST") 转成 gzip（设备侧只认 gzip）"
              zstd -dc "$DSH_ZST" | gzip -9 > "$DSH_GZ"
            fi
          fi
          if [ -z "$DSH_GZ" ]; then
            {
              echo ""
              echo "- ⚠️ **本次没有产出默认模块（full）**：频道清单里没有 dsh 层产物。"
              echo "  默认名只给自带 DSH 的包，所以这次只发 bare（见 ⑤ publish 的模块卡片）。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::频道里没有 dsh 层（dist/dsh-*.erofs.{gz,zst}）→ 本次不产出默认模块"
            exit 0
          fi
          bash module/mkmodule.sh --variant full --version "$MODV" --dsh-layer "$DSH_GZ" \
               --dsh-sums dist/SHA256SUMS.layers.txt
          ls -l dist/sunsetlinux-module-*.zip
          {
            echo ""
            echo "- ✅ 默认模块已打包（自带 DSH）：$(basename "$(ls -1 dist/sunsetlinux-module-*.zip | head -n1)")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传默认模块制品（供 ⑤ publish 收进发布）
        uses: actions/upload-artifact@v4
        with:
          name: module-zip-full
          path: |
            dist/sunsetlinux-module-*.zip
            dist/sunsetlinux-module-*.zip.sha256
          retention-days: 7
          if-no-files-found: warn

      - name: 上传制品（供人工取用/排障）
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundles
          path: dist/bundles/*.bin
          retention-days: 14

      - name: 挂到 Release（v<App 版本>）
        if: ${{ inputs.attach_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VER="$(sed -n 's/^versionName=//p' app/version.properties | head -n1 | tr -d '[:space:]')"
          [ -n "$APP_VER" ] || { echo "::error::读不出 App 版本"; exit 1; }
          TAG="v$APP_VER"
          # ★ 与 release.yml **并行**跑：同一个 push 会同时触发两个工作流，而 Release 是
          #   发布那边建的。0.2.5 就吃过这个亏 —— 本工作流先跑，v0.2.5 还不存在，
          #   于是四份 .bin 静默地没挂上去（步骤还是 success，只有一行 warning）。
          #   现在最多等 6 分钟（每 20 秒看一次），等到了就挂，等不到才放弃。
          ready=""
          for i in $(seq 1 18); do
            if gh release view "$TAG" >/dev/null 2>&1; then ready=1; break; fi
            echo "等待 $TAG 出现（第 $i/18 次，最多 6 分钟）…"
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "::warning::$TAG 等了 6 分钟仍不存在（还没发过正式版？）—— 制品已上传为 workflow artifact，暂不挂 Release"
            exit 0
          fi
          # 只挂"发布名"的那两份（.bin 给用户、.json 给排障/对账）
          gh release upload "$TAG" dist/bundles/*.bin dist/bundles/*.json --clobber
          echo "- 内置离线包已挂到 https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
