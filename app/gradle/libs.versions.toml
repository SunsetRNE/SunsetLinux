# SunsetLinux 启动器 —— Gradle 版本目录
#
# 版本选择依据（本机 aarch64 / Android 16）：
# * AGP 9.0.0：本机构建缓存中唯一可用的大版本；AGP 8.x 的 aapt2 只发布 x86-64/部分
#   aarch64 变体，在本机跑不起来。AGP 9 起「内置 Kotlin 支持」——**不要**再 apply
#   org.jetbrains.kotlin.android，否则直接报 no longer required since AGP 9.0。
# * Kotlin 2.3.10：与 AGP 9.0.0 配套，且 compose compiler plugin 同版本。
# * Compose BOM 2026.01.01：物料与编译器版本解耦，material3 1.4.0 / ui 1.10.x。
[versions]
agp = "9.0.0"
kotlin = "2.3.10"
coreKtx = "1.16.0"
lifecycle = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2026.01.01"
swipeRefresh = "1.1.0"
libsu = "6.0.0"
# 纯 Java 的 zstd 解码器（无 native）。
# 为什么不用 com.github.luben:zstd-jni：它的 jar 里只有 aix/darwin/freebsd/linux/win 原生库，
# **没有 Android ABI**；linux/aarch64 的 .so 是 glibc 链接的，在 bionic 上无法 dlopen。
# 结果会是"能编译、桌面 JVM 跑得通、到设备上 UnsatisfiedLinkError"—— 最坏的一种坑。
aircompressor = "2.0.3"
junit = "4.13.2"
# JVM 单测里 android.jar 的 org.json 是空壳（方法抛 not mocked），需要真实实现
orgJson = "20240303"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# 只用 core 图标集（49 个，含 PlayArrow/Refresh/Settings/List/Build/ExitToApp 等），
# 不引入 material-icons-extended：那会让 debug APK 与 dex 时间大幅膨胀。
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# WebView 的下拉刷新。Compose 的 PullToRefreshBox 依赖 nested scroll，而 WebView 不是
# NestedScrollingChild，会退化成「任何时候下拉都刷新」；SwipeRefreshLayout 走
# canScrollVertically(-1)，与 WebView 配合是正确行为。
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swipeRefresh" }
# 真 root shell（优先使用，失败自动退回 ProcessBuilder("su","-c",...)）
libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
aircompressor = { group = "io.airlift", name = "aircompressor", version.ref = "aircompressor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
