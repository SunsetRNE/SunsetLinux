# Gradle 全局配置
#
# 内存：本机（手机内的 Ubuntu）总内存 22 GB 但常被占满，堆开太大反而触发 OOM/swap 抖动。
# 2048m 与同机其他 Android 工程一致，实测可完成 Compose + aapt2 全流程。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# ⚠️ 本仓测试函数名有中文（反引号），而 `sun.jnu.encoding` 是 JVM 启动时按 **locale** 定的，
#    `-Dfile.encoding` 覆盖不了它。在 locale 为 ASCII 的机器上（本机 Ubuntu 容器实测）会以
#    `Internal compiler error` + `InvalidPathException: … OfflineBundleTest$???…class` 失败。
#    跑法：`LANG=C.UTF-8 LC_ALL=C.UTF-8 ./gradlew …`（CI 天然是 UTF-8，无需处理）。
org.gradle.parallel=true
org.gradle.caching=true
# 刻意不开 configuration-cache：本项目无收益（单模块），但会把任何配置期的
# 外部进程/文件访问变成构建失败，得不偿失。
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# proot 环境下 aapt2 daemon 常报 "Daemon startup failed"，改为一次性进程调用。
android.aapt2.process.daemon=false
kotlin.code.style=official
