# SunsetLinux App 版本号 —— **唯一事实源**（app/build.gradle.kts 用 Properties.load 读这里）
#
# 逐版变更说明在 app/VERSION-NOTES.md（每个 versionName/versionCode 的来龙去脉都在那儿），
# 本文件只留键值，别在这里堆变更记录。
#
# versionName：语义版本（主.次.修订），对外可读
# versionCode：Android 只认这个判"是不是新版"，**每次对外发布必须 +1**
#
# 注意：0.3.0 起是 **2 个 App（root / proot，包名不同、可共存）× 3 个内置档位
# （minimal / base / full）= 6 个组合**，清单在 tools/offline-bundle/variants.json。
# 同**一个 App** 内换档位 = 覆盖安装另一个 APK（同 applicationId / 同签名），数据不丢；
# **跨 App**（root ↔ 免 root）不能覆盖安装，是两个独立包。
versionName=0.3.9
versionCode=25
